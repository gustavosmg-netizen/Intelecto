name: Deploy Portal (Cloudflare Workers)

# Deploy automatico do Worker a cada push na branch de producao (main).
# Disciplina: desenvolver em branch, testar local (wrangler dev / Miniflare) e so
# entao fazer push/merge em main. main == PRODUCAO.
# Secrets NAO sao tocados por "wrangler deploy" (RESEND_API_KEY, GOOGLE_SA_KEY etc.
# continuam setados no painel Cloudflare).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  # Portao da Onda 0: o deploy em main so acontece se a verificacao passar.
  # build:check = wrangler deploy --dry-run (empacota o Worker); npm test = testes
  # de fundacao. Sem segredos nesta etapa. Se quebrar, NADA e publicado.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Build check (wrangler dry-run)
        run: npm run build:check
      - name: Testes de fundacao
        run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
        # Reforco: passa o token/account tambem como env, para o wrangler ler direto
        # do ambiente (evita depender so do mapeamento do wrangler-action).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
