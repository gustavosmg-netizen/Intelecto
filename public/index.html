<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Intelecto &amp; CSTR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f7a3d'/%3E%3Crect x='26' y='16' width='12' height='32' fill='white'/%3E%3Crect x='18' y='16' width='28' height='7' fill='white'/%3E%3Crect x='18' y='41' width='28' height='7' fill='white'/%3E%3C/svg%3E">
<style>
/* Tokens: fonte única = design.css (sistema por tokens em 3 camadas).
   Aqui só ALIASES dos nomes legados desta página para os tokens semânticos
   do design.css. Sem cor crua. Como apontam para tokens já temáticos, seguem
   automaticamente claro/escuro e a troca de marca (data-brand) sem repetição. */
:root{
  --surf:     var(--surface);
  --surf2:    var(--surface2);
  --tx:       var(--ink);
  --tx2:      var(--muted);
  --brand-d:  var(--brand-dark);
  --brand-tx: var(--brand-text);
  --aten:     var(--warn);
  --serio:    var(--serious);
  --shadow:   var(--shadow-sm);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0 0 .4em;font-weight:650;line-height:1.2}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--tx2)}
.err{color:var(--crit)}
.center{text-align:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--surf);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label{display:block;font-size:.82rem;color:var(--tx2);margin:0 0 4px}
.field{margin:0 0 14px}
.btn{background:var(--brand);color:var(--brand-tx);border:none;border-radius:8px;
  padding:10px 16px;font-weight:600}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:var(--surf2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:18px;box-shadow:var(--shadow);margin:0 0 16px}

/* LOGO — sempre a versão branca sobre faixa verde da marca (nítida nos dois temas) */
.logo-dark{display:block;height:auto}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:410px}
#login .logo-wrap{display:flex;justify-content:center;align-items:center;background:var(--brand-d);border-radius:14px;padding:22px 26px;margin:0 0 14px}
#login .logo-wrap img{width:100%;max-width:220px}
.brand-sub{color:var(--tx2);font-size:.9rem;margin:2px 0 20px;text-align:center;letter-spacing:.01em}

/* APP */
/* O #app é a casca do layout sidebar + conteúdo. NÃO capar a largura aqui:
   a área útil quem define é .main-content (margin da sidebar) + .main-body
   (preenche e centra só em telas ultra-largas). Cap de 1000px era parte da
   causa da "tela estreita". */
#app{min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 12px;flex-wrap:wrap;border-bottom:none}
.top-logo{background:var(--brand-d);border-radius:9px;padding:6px 11px;display:inline-flex;align-items:center}
.top-logo img{height:26px;width:auto;display:block}
.top .who{margin-left:auto;text-align:right;line-height:1.2}
.top .who b{display:block}
.nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 20px}
.nav button{background:none;border:none;padding:10px 14px;color:var(--tx2);
  font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 18px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1}
.kpi .l{color:var(--tx2);font-size:.8rem;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--tx2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.02em}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;
  border:1px solid currentColor}
.s-PENDENTE{color:var(--pend)} .s-APROVADO{color:var(--ok)}
.s-DEVOLVIDO{color:var(--serio)} .s-LANÇADO{color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:10px;
  box-shadow:var(--shadow);z-index:50;max-width:90vw}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:560px){.week{grid-template-columns:1fr}}
.day{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px}
.day .dh{font-size:.72rem;color:var(--tx2)} .day .dt{font-weight:700;font-size:1.1rem}
.linkbtn{background:none;border:none;color:var(--brand);padding:0;font-weight:600;font-size:.85rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.pmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.pmchk{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.pmchk input{margin:0}

/* ---------- T4 · Hub / Launcher (porta de entrada; só tokens, sem cor crua) ---------- */
.hub-hero{display:flex;align-items:center;gap:16px;margin:2px 0 22px}
.hub-logo{background:var(--brand-d);border-radius:12px;padding:10px 16px;display:inline-flex;align-items:center;flex-shrink:0}
.hub-logo img{height:34px;width:auto;display:block}
.hub-hello{display:flex;flex-direction:column}
.hub-hi{font-size:1.35rem;font-weight:700;line-height:1.15;color:var(--tx)}
.hub-sub{font-size:.85rem;color:var(--tx2);margin-top:2px}
.hub-sec{font-family:var(--mono);font-size:.68rem;font-weight:500;color:var(--faint);
  text-transform:uppercase;letter-spacing:.1em;margin:20px 0 10px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.hub-card{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;
  background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .25s,transform .08s;width:100%}
.hub-card:hover{border-color:var(--brand);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.hub-card:active{transform:translateY(0)}
.hub-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hub-ic{font-size:1.6rem;line-height:1;background:var(--brand-light);color:var(--brand);
  width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.hub-ct{font-weight:650;font-size:1.02rem;color:var(--tx)}
.hub-cd{font-size:.83rem;color:var(--tx2);line-height:1.35}
.hub-empty{display:flex;align-items:center;gap:14px}
.hub-empty-ic{font-size:1.8rem}
@media(max-width:560px){.hub-grid{grid-template-columns:1fr}.hub-hi{font-size:1.15rem}}

/* ---------- T6 · Perfil & Conta (só tokens, claro/escuro) ---------- */
.pf-head{display:flex;align-items:center;gap:16px;margin:2px 0 20px}
.pf-ava{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--brand-light);color:var(--brand);display:flex;align-items:center;
  justify-content:center;font-size:1.7rem;font-weight:700;border:1px solid var(--line)}
.pf-ava img{width:100%;height:100%;object-fit:cover;display:block}
.pf-id{display:flex;flex-direction:column;gap:4px;min-width:0}
.pf-nome{font-size:1.25rem;font-weight:700;color:var(--tx);line-height:1.15}
.pf-papel{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pf-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.74rem;
  font-weight:600;color:var(--brand);background:var(--brand-light)}
.pf-ro{font-size:.74rem}
.pf-h2{font-size:1.02rem;font-weight:650;color:var(--tx);margin:0 0 4px}
.pf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
@media(max-width:560px){.pf-nome{font-size:1.1rem}}
</style>

<script>
/* A linha abaixo é substituída em produção pelo servidor (montarPagina). */
const SEED={};
SEED.hist=[];

/* Roster inicial (pré-login / fallback). Após o login, _syncPessoas() substitui esta lista
   pelo quadro VIVO vindo do servidor (state.data.membros, tabela `membro` — gerida no RH). */
let PESSOAS=[
  ["ananda","Ananda"],["angelo","Angelo"],["bruno","Bruno"],["caio","Caio"],
  ["cecilia","Cecília"],["david","David"],["gabriela","Gabriela"],["gustavo","Gustavo"],
  ["leo","Léo"],["lucas","Lucas"],["marcelo","Marcelo"],["raphael","Raphael"],
  ["rodrigo","Rodrigo"],["viviane","Viviane"]
];
/* Sincroniza o roster com o quadro ativo do servidor (interno, ativo). Idempotente. */
function _syncPessoas(){
  try{
    var ms=state.data&&state.data.membros;
    if(Array.isArray(ms)&&ms.length){
      PESSOAS=ms.map(function(m){return [String(m[0]),String(m[1])];}).sort(function(a,b){return a[1].localeCompare(b[1]);});
    }
  }catch(e){/* mantém o fallback */}
}

const BASE = location.pathname.replace(/\/+$/,"");
const state = { token:"", slug:"", coord:false, data:null, hub:null, papel:"", owner:false, view:"hub", perfil:null };
const ALLOW=[];  /* colaboradores (slug) autorizados a ver a aba Escritorio de IA, alem da Coordenacao */

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtH(h){return (Math.round(Number(h)*10)/10).toLocaleString("pt-BR")+" h"}
function nomeDe(slug){const p=PESSOAS.find(x=>x[0]===slug);return p?p[1]:slug}
function hoje(){return new Date().toISOString().slice(0,10)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),2600)}
function segundaDe(iso){const d=new Date(iso+"T00:00:00");const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.toISOString().slice(0,10)}
function somaDias(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function brData(iso){const[a,m,d]=iso.split("-");return d+"/"+m}
function addMeses(iso,n){const d=new Date(iso+"T00:00:00");d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function addAnos(iso,n){const d=new Date(iso+"T00:00:00");d.setFullYear(d.getFullYear()+n);return d.toISOString().slice(0,10)}
function nomeMes(m){return ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][Number(m)-1]||""}
function nomeMesLongo(m){return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][Number(m)-1]||""}
async function api(action,extra,_noreauth){
  const body=Object.assign({action},extra||{});
  /* M2: a sessão vai pelo cookie HttpOnly (enviado automaticamente no fetch same-origin); nada de token no corpo. */
  const r=await fetch(BASE+"/api",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!j.ok){
    /* S-03: ação sensível (R$, exclusão, acesso) pede senha reconfirmada. Confirma e repete uma vez. */
    if(!_noreauth && typeof j.error==="string" && j.error.indexOf("REAUTH_NECESSARIO")===0){
      var s=null; try{s=prompt("Confirme a sua senha para esta ação sensível:");}catch(_){s=null;}
      if(s){ await api("reauth",{senha:s},true); return api(action,extra,true); }
    }
    throw new Error(j.error||"Erro inesperado.");
  }
  return j;
}
/* Capabilities do usuário (modelo por cargo): o servidor devolve state.caps/hub.caps.
   O gate REAL é no servidor; aqui é só para mostrar/esconder ação. "*" e "area.*" valem. */

/* Gestao de projeto (espelha podeGestaoProjeto do servidor): coordenacao/admin (state.coord) OU
 * cargo com projetos.aprovar. Decide se a conta abre o DETALHE rico e o ANDAMENTO; a execucao
 * (equipe) fica na lista basica da carteira e no lancamento das proprias horas. */
function podeGestaoProj(){return !!((state&&state.coord)||temCap('projetos.aprovar'));}

/* ===================== APP ===================== */
async function entrarApp(){
  /* Cargas pós-login em PARALELO (antes eram seriais) + 1 retry se algo falhar num cold start
     do Worker/D1 — assim um erro transitório não aparece como "falha de login". */
  async function _cargas(){ await Promise.all([carregarState(), carregarHub()]); }
  try{ await _cargas(); }catch(e){ /* carregarHub pode lançar */ }
  if(!(state.hub&&state.data&&state.data.ok)){
    await new Promise(function(r){setTimeout(r,700);});
    try{ await _cargas(); }catch(e){}
  }
  /* T6 — pré-carrega o Perfil (ação própria, piso 'cliente': todo logado pode) para que a
     foto e o nome de exibição apareçam já na barra lateral. Nunca derruba o login. */
  try{ state.perfil=await api("perfil"); }catch(e){ state.perfil=null; }
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#ap-nome").textContent=(state.perfil&&state.perfil.nome)||(state.hub&&state.hub.nome)||nomeDe(state.slug);
  $("#ap-cargo").textContent=(state.data&&state.data.cargos&&state.data.cargos[state.slug])||(state.hub&&state.hub.papelLabel)||(state.coord?"Coordenação":"Equipe");
  /* A ficha do usuário na barra lateral abre a própria conta (T6). */
  var su=document.querySelector(".sidebar-user");
  if(su){su.style.cursor="pointer";su.title="Minha Conta";su.onclick=function(){irPara("perfil")};}
  montarNav();
  irPara("hub");
}
async function carregarState(){
  try{
    const j=await api("state");
    state.slug=j.slug; state.coord=j.coord; state.data=j;
    _syncPessoas();
  }catch(e){
    /* Cliente/Fornecedor não têm acesso a 'state' (o guard T2 nega, piso equipe). Mantém
       a casca mínima; o Hub lê a liberação pela ação própria 'hub' (piso cliente). */
    state.data=state.data||{};
  }
}
async function carregarHub(){
  /* Fonte de verdade da porta de entrada: o SERVIDOR decide os módulos (auth + MIN).
     O front só RENDERIZA state.hub.modulos; esconder no front nunca é a fronteira. */
  const j=await api("hub");
  state.hub=j; state.slug=state.slug||j.slug; state.papel=j.papel;
  state.coord=j.coord; state.owner=j.owner;
}
/* A navegação é derivada do que o SERVIDOR liberou (state.hub.modulos, vindo da ação
   'hub'), mais o próprio Hub no topo. Assim a sidebar nunca mostra atalho que a API
   negaria: equipe+ mantém exatamente a navegação de hoje; Cliente/Fornecedor só veem
   o Hub (seus cards liberados). O recorte continua no servidor — isto é só afordância. */
function montarNav(){
  var mods=(state.hub&&state.hub.modulos)||[];
  var items=[];
  items.push({id:"hub",label:"Início",icon:"🏠"});
  var ordem=["PROJETOS","COMERCIAL","FINANCEIRO","PESSOAS","CONHECIMENTO","ADMINISTRAÇÃO"];
  var SECTIT={PROJETOS:"Projetos & Engenharia",COMERCIAL:"Comercial",FINANCEIRO:"Financeiro",PESSOAS:"Pessoas",CONHECIMENTO:"Conhecimento & IA","ADMINISTRAÇÃO":"Administração"};
  ordem.forEach(function(g){
    var gm=mods.filter(function(m){return m.grupo===g;});
    if(!gm.length)return;
    items.push({g:SECTIT[g]||g});
    gm.forEach(function(m){items.push({id:m.view,label:m.label,icon:m.icon});});
  });
  /* T6 — "Minha Conta" está sempre disponível a qualquer logado (ação própria, piso
     'cliente'); não é um módulo liberado do Hub, por isso entra fora do catálogo. */
  items.push({g:"CONTA"});
  items.push({id:"perfil",label:"Minha Conta",icon:"👤"});
  var html="";
  items.forEach(function(it){
    if(it.g){
      html+='<div class="sidebar-group"><div class="sidebar-group-label">'+it.g+'</div></div>';
    }else{
      var act=state.view===it.id?" active":"";
      html+='<button class="sidebar-item'+act+'" data-v="'+it.id+'"><span class="icon">'+it.icon+'</span>'+esc(it.label)+'</button>';
    }
  });
  $("#ap-nav").innerHTML=html;
  $("#ap-nav").querySelectorAll(".sidebar-item").forEach(function(b){b.onclick=function(){irPara(b.dataset.v)}});
  var titles={hub:"Início",inicio:"Painel do Dia",lancar:"Lançar Horas",apont:"Apontamentos",pend:"Pendentes",projetos:"Projetos",showcase:"Vitrine de Projetos",agenda:"Agenda",cadastro:"Cadastro",escritorio:"Escritório de IA",comercial:"Comercial · CRM",brief:"Daily Brief",acervo:"Acervo Técnico",trilhas:"Trilhas",dna:"DNA & Ativos",permissoes:"Permissões",conhecimento:"Conhecimento",portfolio:"Portfólio",servicos:"Portfólio de Serviços",ficha:"Minha ficha",perfil:"Minha Conta",financeiro:"Financeiro"};
  /* Título por papel (roteado pelo servidor via state.coord): Coordenação/Admin veem o
     Resumo Executivo no Início; Equipe mantém o Painel do Dia. Só apresentação. */
  var _tit=titles[state.view]||state.view;
  if(state.view==="inicio"&&state.coord)_tit="Resumo Executivo";
  var h1=$("#ap-title"); if(h1) h1.textContent=_tit;
  /* T6 — a ficha mostra a foto quando houver; senão, a inicial do nome. */
  var av=$("#ap-avatar");
  if(av){
    var pfa=(state.perfil&&state.perfil.avatar)||"";
    var pfn=(state.perfil&&state.perfil.nome)||nomeDe(state.slug)||"?";
    if(pfa){av.innerHTML='<img src="'+esc(pfa)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';}
    else{av.innerHTML="";av.textContent=pfn.charAt(0).toUpperCase();}
  }
}

/* Tela da própria conta: foto, dados editáveis (nome/e-mail), papel em LEITURA e troca de
   senha pelo próprio usuário. A fronteira é o servidor — aqui só renderiza/encaminha:
   o papel é um campo desabilitado e nenhuma requisição daqui envia 'papel'. */
function _lerAvatar(file,cb){
  if(file.size>5*1024*1024){cb(null,"Arquivo grande demais. Escolha uma imagem menor.");return;}
  var r=new FileReader();
  r.onerror=function(){cb(null,"Não foi possível ler o arquivo.")};
  r.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null,"Arquivo de imagem inválido.")};
    img.onload=function(){
      var max=256,w=img.width,h=img.height;
      if(w>=h){ if(w>max){h=Math.round(h*max/w);w=max;} } else { if(h>max){w=Math.round(w*max/h);h=max;} }
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      var out=c.toDataURL("image/jpeg",0.82);
      if(out.length>65536){out=c.toDataURL("image/jpeg",0.6);}
      cb(out,null);
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

function _pjProj(){
  var proj=(state.data.proj||[]).slice();
  var xm={}; (state.data.projx||[]).forEach(function(x){if(x)xm[x.cc]=x;});
  var gm=state.data.gastas||{};
  proj.forEach(function(p){
    var x=xm[p.cc]||{};
    p._resp=x.resp||"";
    p._prev=Number(x.prev)||0;                    /* horas previstas em contrato */
    p._gastas=Number(gm[p.cc])||0;                /* horas gastas (aprovado/lançado) */
    p._progresso=Math.max(0,Math.min(100,Number(x.progresso)||0));
    p._gut=_prio100(x);
  });
  return proj;
}
/* Prioridade 1-100 = média de (G×U×T)/125 e (Impacto×Esforço)/25, em %. 0 = não avaliado. */
function _prio100(x){x=x||{};var gut=(Number(x.gravidade)||0)*(Number(x.urgencia)||0)*(Number(x.tendencia)||0);var ie=(Number(x.impacto)||0)*(Number(x.esforco)||0);return Math.round((gut/125*100+ie/25*100)/2);}
/* Faixa de cor da prioridade (0-100) por token. 0 = não avaliado. */
function _gutCor(g){return g>=70?"var(--crit)":(g>=40?"var(--warn)":(g>0?"var(--info)":"var(--chart-track)"));}
function _gutChip(g){if(!g)return '<span class="muted" style="font-size:.74rem">—</span>';

/* Barra horas gasto×previsto: cheia = previsto; preenchimento = gasto; estouro vira crítico. */
function _horasBar(gastas,prev){
  if(!prev){return '<span class="muted" style="font-size:.74rem">sem previsto</span>';}
  var pct=prev>0?gastas/prev*100:0, estouro=gastas>prev;
  var cor=estouro?"var(--crit)":(pct>=85?"var(--warn)":"var(--chart-accent)");
  var w=Math.min(100,pct);
  return '<div style="display:flex;align-items:center;gap:6px">'+
    '<div style="flex:1;min-width:60px;height:8px;background:var(--chart-track);border-radius:999px;overflow:hidden" title="'+fmtH(gastas)+' de '+fmtH(prev)+'">'+
      '<div style="height:100%;width:'+w+'%;background:'+cor+';border-radius:999px"></div></div>'+
    '<span class="muted" style="font-size:.72rem;font-variant-numeric:tabular-nums;white-space:nowrap">'+Math.round(pct)+'%</span>'+
  '</div>';
}

function _progBar(v){v=Math.max(0,Math.min(100,Number(v)||0));
  return '<div style="display:flex;align-items:center;gap:6px">'+
    '<div style="flex:1;min-width:50px;height:8px;background:var(--chart-track);border-radius:999px;overflow:hidden">'+

function _pjFiltrar(){

function _pjTabela(L){
  /* Gestão (coord) vê a visão executiva completa: prioridade GUT, horas gasto×previsto e
     progresso vêm de projx/gastas, que o servidor só devolve à Coordenação. Equipe vê a
     carteira sem essas colunas (o servidor não lhe manda o dado). */

function _d(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||"")))return null;var t=new Date(s+"T00:00:00");return isNaN(t)?null:t;}
function _pjGantt(L){
  var items=L.map(function(p){var s=_d(p.inicio)||_d(p.previsto)||_d(p.fim);var e=_d(p.fim)||_d(p.previsto)||_d(p.inicio);if(!s||!e)return null;return {p:p,s:s,e:(e<s?s:e)};}).filter(Boolean);

  var max=new Date(Math.max.apply(null,items.map(function(x){return x.e.getTime();})));

  var months=[],cur=new Date(min);

  var MN=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

      '<div data-cc="'+esc(x.p.cc)+'" style="position:relative;flex:1;height:16px;background:var(--surf);border:1px solid var(--line);border-radius:4px;cursor:pointer">'+
        '<div title="'+esc(x.p.projeto)+' ('+esc(x.p.inicio||"?")+" -> "+esc(x.p.fim||x.p.previsto||"?")+')" style="position:absolute;left:'+off+'%;width:'+wid+'%;top:2px;bottom:2px;background:'+_corSt(x.p.status)+';border-radius:3px"></div>'+
      '</div></div>';
  }).join("");
  return '<div class="card" style="padding:10px 12px;overflow-x:auto"><div style="min-width:760px">'+
    '<div style="display:flex;margin-left:208px;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:6px">'+head+'</div>'+rows+'</div></div>';
}

/* Fiação do painel Contrato & parcelas: criar/confirmar contrato, criar/baixar parcela. Cada ação
   re-busca o projdetalhe e re-renderiza (mesmo padrão do andamento). */
function _contratoLiga(j){
  var cc=j.cc; var V=function(id){var e=$("#"+id);return e?e.value:"";};
  var msg=function(t,err){var m=$("#ct-msg");if(m){m.textContent=t;m.classList.toggle("err",!!err);}};
  var reload=function(ok){return api("projdetalhe",{cc:cc}).then(function(nj){PJDET=nj;PJDET.edit=false;_pjRender();if(ok)toast(ok);});};
  var nv=document.querySelector(".ct-novo");if(nv)nv.onclick=function(){
    var val=Number(V("ct-val"))||0; if(!(val>0)){msg("Informe o valor do contrato.",true);return;}
    msg("Salvando…");api("contratoSet",{cc:cc,titulo:V("ct-tit"),valor:val,tipo:V("ct-tipo"),assinado:V("ct-ass"),status:"rascunho"}).then(function(){return reload("Contrato criado.");}).catch(function(e){msg(e.message||"Erro",true);});
  };
  document.querySelectorAll(".ct-conf").forEach(function(b){b.onclick=function(){
    if(!confirm("Confirmar o contrato? O valor confirmado passa a ser o valor do Financeiro deste projeto."))return;
    msg("Confirmando…");api("contratoSet",{id:b.getAttribute("data-cid"),cc:cc,status:"confirmado"}).then(function(){return reload("Contrato confirmado.");}).catch(function(e){msg(e.message||"Erro",true);});
  };});
  document.querySelectorAll(".pc-add").forEach(function(b){b.onclick=function(){
    var cid=b.getAttribute("data-cid");var val=Number(V("pc-v-"+cid))||0;if(!(val>0)){msg("Informe o valor da parcela.",true);return;}
    msg("Salvando…");api("parcelaSet",{contrato_id:cid,numero:Number(V("pc-n-"+cid))||1,valor:val,venc_prev:V("pc-d-"+cid)}).then(function(){return reload("Parcela adicionada.");}).catch(function(e){msg(e.message||"Erro",true);});
  };});
  document.querySelectorAll(".pc-baixa").forEach(function(s){s.onchange=function(){
    if(!s.value)return;msg("Baixando…");api("parcelaBaixar",{parcela_id:s.getAttribute("data-pid"),fluxo_id:s.value}).then(function(){return reload("Parcela baixada; centro de custo preenchido no caixa.");}).catch(function(e){msg(e.message||"Erro",true);});
  };});
  document.querySelectorAll(".pc-desfaz").forEach(function(b){b.onclick=function(){
    msg("Desfazendo…");api("parcelaBaixar",{parcela_id:b.getAttribute("data-pid"),fluxo_id:""}).then(function(){return reload("Baixa desfeita.");}).catch(function(e){msg(e.message||"Erro",true);});
  };});
}

function _pjEditLiga(j){
  var v=function(id){var e=$("#"+id);return e?e.value:"";};
  function recalc(){var e=$("#ed-gut");if(e)e.textContent="Prioridade "+_prio100({gravidade:v("ed-g"),urgencia:v("ed-u"),tendencia:v("ed-t"),impacto:v("ed-imp2"),esforco:v("ed-esf")});}
  ["ed-g","ed-u","ed-t","ed-imp2","ed-esf"].forEach(function(id){var e=$("#"+id);if(e)e.onchange=recalc;});
  var c=$("#ed-cancel");if(c)c.onclick=function(){PJDET.edit=false;_pjRender();};
  var s=$("#ed-save");if(s)s.onclick=function(){
    var msg=$("#ed-msg");if(msg){msg.textContent="Salvando…";msg.classList.remove("err");}
    var cc=j.cc;
    var base={projeto:j.proj.projeto,subtipo:j.proj.subtipo,status:j.proj.status};
    s.disabled=true;
    api("setproj",{cc:cc,status:v("ed-status"),resp:v("ed-resp"),setor:v("ed-setor"),inicio:v("ed-inicio"),previsto:v("ed-previsto"),fim:v("ed-fim"),base:base})
      .then(function(){
        return api("setprojx",{cc:cc,com:v("ed-com"),assin:v("ed-assin"),prev:Number(v("ed-prev"))||0,obs:v("ed-obs"),
          gravidade:Number(v("ed-g"))||0,urgencia:Number(v("ed-u"))||0,tendencia:Number(v("ed-t"))||0,
          impacto:Number(v("ed-imp2"))||0,esforco:Number(v("ed-esf"))||0,progresso:Number(v("ed-prog"))||0});
      })
      .then(function(){
        /* Financeiro (só dono): grava contrato/percentuais por projeto. Os ids só existem no DOM
           quando j.podeFin montou o fieldset — guarda dupla (flag + presença do campo). */
        if(!j.podeFin||!$("#ed-contratado"))return;
        return api("projfinSet",{cc:cc,contratado:Number(v("ed-contratado"))||0,outros:Number(v("ed-outros"))||0,
          consumiveis:Number(v("ed-consumiveis"))||0,terceiros:Number(v("ed-terceiros"))||0,
          pct_imposto:Number(v("ed-imposto"))||0,pct_lucro:Number(v("ed-luc"))||0});
      })
      .then(function(){
        toast("Gestão do projeto atualizada.");
        /* Atualiza o cache local (state.data.proj/projx/gastas) e a carteira, sem recarregar tudo. */
        return carregarState();
      })
      .then(function(){
        /* Atualiza a view corrente com o state recém-recarregado (listeners de tab são globais). */
        if(state.view==="projetos"&&typeof aplicaPj==="function")aplicaPj();
        else if(state.view==="inicio"){var el=$("#view");if(el)el.innerHTML=viewInicio();}
        return api("projdetalhe",{cc:cc});
      })
      .then(function(nj){PJDET=nj;PJDET.edit=false;_pjRender();})
      .catch(function(e){s.disabled=false;if(msg){msg.textContent=e.message||"Erro ao salvar.";msg.classList.add("err");}});
  };
}

function viewConhecimento(){
  const head=viewHead("Conhecimento","Conhecimento","Contextos, procedimentos, guias e links da casa.");
  const cont=(state.data.conteudo||[]).slice();
  if(!cont.length) return head+`<div class="card"><p class="muted" style="margin:0">Nenhum conteúdo cadastrado ainda.</p></div>`;
  const areas={}; cont.forEach(c=>{(areas[c.area]=areas[c.area]||[]).push(c);});
  const blocos=Object.keys(areas).sort().map(a=>{
    const items=areas[a].map(c=>`<article class="lib-card">
      ${c.tag?`<span class="lib-tag">${esc(c.tag)}</span>`:""}
      <div class="lib-title">${esc(c.titulo)}</div>
      ${c.descricao?`<div class="lib-desc">${esc(c.descricao)}</div>`:""}
      ${c.url?`<div class="lib-act"><a href="${esc(c.url)}" target="_blank" rel="noopener" class="linkbtn">abrir →</a></div>`:""}
    </article>`).join("");
    return `<div class="lib-group-label">${esc(a)}</div><div class="lib-grid">${items}</div>`;
  }).join("");
  return head+blocos;
}

/* Capítulo fixo (não é módulo): o passo a passo do PRIMEIRO ACESSO, do convite/solicitação
   à senha e ao primeiro login. Aparece no topo das Trilhas para todo logado. */
function _trilhaPrimeiroAcesso(){

    "Primeiro login: entre com e-mail e senha; o Hub mostra só os módulos liberados ao seu papel."
  ].map(function(s){return '<li>'+esc(s)+'</li>';}).join("");
  return '<article class="card trilha-cap">'+
    '<div class="trilha-cap-h"><span class="trilha-cap-ic">🔑</span>'+
      '<div><div class="trilha-cap-t">Primeiro acesso ao portal</div>'+
      '<div class="trilha-cap-s">Do convite ou da solicitação até a sua senha e o primeiro login.</div></div></div>'+
    '<div class="trilha-cap-sec">O que preenche e em que ordem</div><ol class="trilha-steps">'+passos+'</ol>'+
    '<div class="trilha-cap-sec">Quem preenche (cargo e acesso)</div><p style="margin:4px 0 0;font-size:.87rem;color:var(--ink2)">Você solicita; a Coordenação aprova e atribui papel e cargo. O Admin concede papéis sensíveis (coordenação/admin).</p>'+
    '<div class="trilha-cap-sec">Resultado</div><p style="margin:4px 0 0;font-size:.87rem;color:var(--ink2)">Conta ativa, com acesso só aos módulos do seu papel.</p>'+
    '<div class="trilha-dica"><strong>Dica.</strong> Esqueceu a senha? Use “Esqueci minha senha” na tela de entrada — o link é de uso único e expira.</div>'+
  '</article>';
}
/* Trilha POR CARGO: puxa o cargo do próprio usuário (meucargo) + as capabilities (state.caps)
   e monta a trilha dele — onboarding em ordem, rotinas, cadência e os módulos do cargo. */
function _trilhaDoCargo(){
  var box=$("#trilha-cargo");if(!box)return;
  api("meucargo").then(function(j){
    var c=j.cargo;
    if(!c){box.innerHTML='<article class="card trilha-cap"><div class="trilha-cap-h"><span class="trilha-cap-ic">🧭</span><div><div class="trilha-cap-t">Trilha do seu cargo</div><div class="trilha-cap-s">Seu cargo ainda não foi atribuído.</div></div></div><p class="muted" style="margin:6px 0 0;font-size:.86rem">Assim que a Coordenação atribuir seu cargo no RH, sua trilha (onboarding, rotinas e módulos) aparece aqui.</p></article>';return;}
    function lista(v,ol){var xs=String(v||"").split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);if(!xs.length)return"";var tag=ol?"ol":"ul";return '<'+tag+' class="trilha-steps" style="margin:4px 0 0">'+xs.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</'+tag+'>';}
    var CAP_MOD={projetos:["projetos","Projetos"],horas:["lancar","Horas"],agenda:["agenda","Agenda"],comercial:["comercial","Leads Ambientais"],financeiro:["financeiro","Financeiro"],acervo:["acervo","Acervo"],brief:["brief","Daily Brief"],escritorio:["escritorio","Escritório de IA"],rh:["rh","RH & Cargos"],pessoas:["rh","RH & Cargos"],dna:["dna","DNA & Ativos"],acesso:["permissoes","Permissões"],sistema:["permissoes","Configuração"]};
    var cs=(state.caps||[]),seen={},mods=[];
    cs.forEach(function(cp){if(cp==="*")return;var a=String(cp).split(".")[0];var m=CAP_MOD[a];if(m&&!seen[m[0]]){seen[m[0]]=1;mods.push(m);}});
    var modHtml=mods.length?('<div class="trilha-cap-sec">Módulos do seu cargo</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+mods.map(function(m){return '<button class="btn sec sm" data-go="'+esc(m[0])+'">'+esc(m[1])+' →</button>';}).join("")+'</div>'):"";
    var cap=(c.vinculo||"Contratado")+(c.horas_dia>0?" · "+c.horas_dia+" h/dia":"");
    box.innerHTML='<article class="card trilha-cap" style="border-left:3px solid var(--brand)">'+
      '<div class="trilha-cap-h"><span class="trilha-cap-ic">🧭</span><div><div class="trilha-cap-t">Trilha do seu cargo: '+esc(c.nome)+'</div><div class="trilha-cap-s">'+esc(cap)+'</div></div></div>'+
      (c.missao?'<p style="margin:6px 0 0;font-size:.9rem">'+esc(c.missao)+'</p>':"")+
      (c.onboarding?'<div class="trilha-cap-sec">Onboarding (nesta ordem)</div>'+lista(c.onboarding,true):"")+
      (c.rotinas?'<div class="trilha-cap-sec">Suas rotinas</div>'+lista(c.rotinas,false):"")+
      (c.cadencia?'<div class="trilha-cap-sec">Cadência</div><p style="margin:4px 0 0;font-size:.87rem;color:var(--ink2)">'+esc(c.cadencia)+'</p>':"")+
      modHtml+
    '</article>';
    box.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){irPara(b.dataset.go);};});
  }).catch(function(){var b=$("#trilha-cargo");if(b)b.innerHTML="";});
}
function viewTrilhas(el){
  var head=viewHead("Manual vivo","Trilhas","Um capítulo por módulo que você acessa — como usar cada parte do portal, no seu papel, e o passo a passo do primeiro acesso.");
  el.innerHTML=head+'<p class="muted" style="padding:10px 0">Carregando seus capítulos…</p>';
  api("trilhas").then(function(j){
    /* Capítulos = módulos liberados pelo servidor (menos o próprio Trilhas, para não auto-referenciar). */
    var mods=(j.modulos||[]).filter(function(m){return m.view!=="trilhas";});
    var intro='<div class="card" style="margin-bottom:16px"><p style="margin:0;color:var(--ink2)">'+
      'Este é o manual vivo do portal. Abaixo estão <strong>só os módulos liberados ao seu acesso'+
      (j.papelLabel?' ('+esc(j.papelLabel)+')':'')+'</strong> — cada capítulo traz o objetivo do módulo, as ações principais e uma dica da casa.</p></div>';
    if(!mods.length){
      el.innerHTML=head+intro+'<div class="card hub-empty"><span class="hub-empty-ic">🧭</span><span><strong>Nenhum módulo liberado ainda.</strong><span class="muted" style="display:block;margin-top:4px">Assim que a Coordenação habilitar seus módulos, os capítulos aparecem aqui.</span></span></div>';
      return;
    }
    var ordem=["PROJETOS","COMERCIAL","FINANCEIRO","PESSOAS","CONHECIMENTO","ADMINISTRAÇÃO"];
    var secTit={PROJETOS:"Projetos & Engenharia",COMERCIAL:"Comercial",FINANCEIRO:"Financeiro",PESSOAS:"Pessoas",CONHECIMENTO:"Conhecimento & IA",ADMINISTRAÇÃO:"Administração"};
    var html=head+intro+_trilhaPrimeiroAcesso()+'<div id="trilha-cargo"></div>';
    ordem.forEach(function(g){
      var gm=mods.filter(function(m){return m.grupo===g;});
      if(!gm.length)return;
      html+='<div class="lib-group-label">'+esc(secTit[g]||g)+'</div>';
      gm.forEach(function(m){
        var guia=TRILHA_GUIAS[m.id]||{obj:m.resumo||"",passos:[],dica:""};
        var passos=(guia.passos||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join("");
        html+='<article class="card trilha-cap">'+
          '<div class="trilha-cap-h"><span class="trilha-cap-ic">'+(m.icon||"▫")+'</span>'+
            '<div><div class="trilha-cap-t">'+esc(m.titulo||m.label)+'</div>'+
            '<div class="trilha-cap-s">'+esc(guia.obj||m.resumo||"")+'</div></div></div>'+
          (passos?'<div class="trilha-cap-sec">O que preenche e em que ordem</div><ol class="trilha-steps">'+passos+'</ol>':"")+
          (guia.quem?'<div class="trilha-cap-sec">Quem preenche (cargo e acesso)</div><p style="margin:4px 0 0;font-size:.87rem;color:var(--ink2)">'+esc(guia.quem)+'</p>':"")+
          (guia.resultado?'<div class="trilha-cap-sec">Resultado</div><p style="margin:4px 0 0;font-size:.87rem;color:var(--ink2)">'+esc(guia.resultado)+'</p>':"")+
          (guia.dica?'<div class="trilha-dica"><strong>Dica.</strong> '+esc(guia.dica)+'</div>':"")+
          '<div class="trilha-cap-act"><button class="btn sec sm" data-go="'+esc(m.view)+'">Abrir módulo →</button></div>'+
        '</article>';
      });
    });
    el.innerHTML=html;
    el.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){irPara(b.dataset.go);};});
    _trilhaDoCargo();
  }).catch(function(e){el.innerHTML=head+'<p class="err" style="padding:14px">Não foi possível carregar as trilhas: '+esc(e.message||e)+'</p>';});
}
/* ===================== DNA & ATIVOS — central de marca + documentos =====================
   Piso 'coordenacao' (guard MIN da ação 'dna'; equipe/cliente/fornecedor negados na borda).
   Kit de marca = tokens do Design System lidos em RUNTIME (verdade única, acompanham o tema)

   acervo da casa via ação 'dna' (tabela 'conteudo' filtrada por tenant). Sem valor monetário. */
function _dnaSwatch(nome,token){
  var v="";try{v=(getComputedStyle(document.documentElement).getPropertyValue(token)||"").trim();}catch(e){v="";}
  return '<div class="dna-sw"><div class="dna-sw-chip" style="background:var('+token+')"></div>'+
    '<div class="dna-sw-meta"><div class="dna-sw-name">'+esc(nome)+'</div>'+
    '<div class="dna-sw-val">'+esc(token)+(v?' · '+esc(v):'')+'</div></div></div>';
}
function _dnaGrupo(titulo,pares){
  var sw=pares.map(function(p){return _dnaSwatch(p[0],p[1]);}).join("");
  return '<div class="lib-group-label">'+esc(titulo)+'</div><div class="dna-swgrid">'+sw+'</div>';
}

function renderAgendaLista(){

function ligaAgenda(){
  var d=$("#ag-d");if(d&&!d.value)d.value=hoje();
  var rep=$("#ag-rep");if(rep)rep.onchange=function(){var b=$("#ag-recbox");if(b)b.classList.toggle("hidden",!rep.checked);};

function _agVal(id){var e=$("#"+id);return e?String(e.value||"").trim():"";}
function agColeta(){
  return {id:_agVal("ag-id"),d:_agVal("ag-d"),hora:_agVal("ag-hora"),tipo:_agVal("ag-tipo"),
    titulo:_agVal("ag-titulo"),setor:_agVal("ag-setor"),resp:_agVal("ag-resp"),cc:_agVal("ag-cc"),
    fase:_agVal("ag-fase"),local:_agVal("ag-local"),obs:_agVal("ag-obs"),pauta:_agVal("ag-pauta")};
}
async function agSalvar(){
  var msg=$("#ag-msg");if(msg){msg.textContent="";msg.className="";}
  var ev=agColeta();
  if(!ev.d){if(msg){msg.textContent="Informe a data do evento.";msg.className="err";}return;}
  if((ev.titulo||"").length<3){if(msg){msg.textContent="Descreva o evento em pelo menos 3 letras.";msg.className="err";}return;}
  var editando=!!ev.id;
  var repetir=!editando&&$("#ag-rep")&&$("#ag-rep").checked;
  var btn=$("#ag-salvar");if(btn)btn.disabled=true;
  try{
    if(repetir){
      var rec={freq:_agVal("ag-freq"),modo:_agVal("ag-modo")};
      if(rec.modo==="ate")rec.ate=_agVal("ag-ate");else rec.count=Number(_agVal("ag-count")||0);
      var jr=await api("addserie",{ev:ev,rec:rec});
      toast("Série criada: "+jr.n+" ocorrência(s)."+(jr.atingiuTeto?" Teto de "+jr.teto+" atingido.":""));
    }else{
      await api("addevento",{ev:ev});
      toast(editando?"Evento atualizado.":"Evento adicionado.");
    }
    agReset();
    loadAgenda();
  }catch(e){if(msg){msg.textContent=e.message||String(e);msg.className="err";}}
  if(btn)btn.disabled=false;
}
function agEditar(id){
  var e=_agEv.find(function(x){return x.id===id;});if(!e)return;
  var set=function(k,v){var el=$("#"+k);if(el)el.value=v==null?"":v;};
  set("ag-id",e.id);set("ag-d",e.d);set("ag-hora",e.hora);set("ag-tipo",e.tipo||"REUNIAO");
  set("ag-titulo",e.titulo);set("ag-setor",e.setor);set("ag-resp",e.resp);set("ag-cc",e.cc);
  set("ag-fase",e.fase);set("ag-local",e.local);set("ag-obs",e.obs);set("ag-pauta",e.pauta);
  var rep=$("#ag-rep");if(rep){rep.checked=false;}var rb=$("#ag-recbox");if(rb)rb.classList.add("hidden");
  var rw=$("#ag-repwrap");if(rw)rw.classList.add("hidden");   /* edição é da ocorrência; recorrência só na criação */
  var ft=$("#ag-formtit");if(ft)ft.textContent="Editar evento"+(e.serie_id?" (ocorrência de série)":"");

/* ===================== SHOWCASE / PORTAL DO CLIENTE =====================
   Vitrine executiva dos projetos/entregas que já existem no portal. A fronteira do que
   cada papel enxerga é o SERVIDOR (ação 'showcase'): o cliente só recebe projetos do seu
   cliente liberados a ele. O front só RENDERIZA o que a API devolveu. Sem valor monetário. */
function _scEntreg(prod,cc){
  return (prod||[]).filter(function(x){
    return String(x.ccs||"").split(/[\s,;]+/).filter(Boolean).indexOf(String(cc))>=0;
  });
}
function _scCard(p,prod,andam,podeLiberar,modoCliente){
  var ent=_scEntreg(prod,String(p.cc));
  var a=(andam||{})[p.cc];
  var prog="";
  if(a&&a.total>0){var pct=Math.round(a.etapa/a.total*100);if(pct>100)pct=100;if(pct<0)pct=0;
    prog='<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--tx2)">'+
      '<span>Etapa '+esc(a.etapa)+' de '+esc(a.total)+(a.detalhe?' · '+esc(a.detalhe):'')+'</span><span>'+pct+'%</span></div>'+
      '<div style="height:6px;background:var(--chart-track);border-radius:999px;margin-top:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--brand)"></div></div></div>';
  }
  var entHtml=ent.length?('<div style="margin-top:10px"><div class="muted" style="font-size:.72rem;margin-bottom:4px">Entregáveis ('+ent.length+')</div>'+
      ent.slice(0,6).map(function(x){return '<span class="tag tag-brand" style="margin:0 3px 3px 0;display:inline-block">'+esc(x.titulo||("#"+x.n))+'</span>';}).join("")+
      (ent.length>6?'<span class="muted" style="font-size:.72rem">+'+(ent.length-6)+'</span>':"")+'</div>')
    :'<div class="muted" style="font-size:.72rem;margin-top:10px">Sem entregáveis catalogados.</div>';
  var rodape="";
  if(!modoCliente){
    var on=Number(p.liberado_cliente)===1;
    if(podeLiberar){
      rodape='<button class="btn '+(on?'':'sec ')+'sm" data-lib="'+esc(p.cc)+'" data-on="'+(on?'1':'0')+'" style="margin-top:12px;width:100%">'+
        (on?'✓ Liberado ao cliente — remover':'Liberar ao cliente')+'</button>';
    }else{
      rodape=on?'<div class="tag tag-ok" style="margin-top:12px;display:inline-block">Liberado ao cliente</div>'
               :'<div class="muted" style="font-size:.72rem;margin-top:12px">Não liberado ao cliente.</div>';
    }
  }
  /* Mesmo modelo visual do bloco "Cases em destaque" (vt-card): faixa de capa + chips + título +
     linha muted de cc, depois progresso/entregáveis/rodapé. Padroniza a Vitrine de ponta a ponta. */
  var capa='<div class="vt-capa" style="height:72px;border-radius:10px 10px 0 0;background:linear-gradient(135deg,var(--brand,#1f7a3d),var(--brand-d,#155c2d));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem">🗂️</div>';
  var chips='<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'+(p.tipo?_vtTipoChipArea(p.tipo):'')+_pill(p.status)+'</div>';
  return '<div class="card vt-card" style="padding:0;overflow:hidden;display:flex;flex-direction:column">'+capa+
    '<div style="padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1">'+
      chips+
      '<div style="font-weight:700;font-size:1rem;line-height:1.25">'+esc(p.projeto||p.cc)+'</div>'+
      '<div class="muted" style="font-size:.76rem">'+esc(p.cc)+'</div>'+
      prog+entHtml+rodape+
    '</div>'+
  '</div>';
}
function _scGrid(proj,prod,andam,podeLiberar,modoCliente){
  var grupos={};
  (proj||[]).forEach(function(p){var c=p.cliente||"Sem cliente";(grupos[c]=grupos[c]||[]).push(p);});
  var chaves=Object.keys(grupos).sort();
  return chaves.map(function(c){
    var cards=grupos[c].map(function(p){return _scCard(p,prod,andam,podeLiberar,modoCliente);}).join("");
    return '<div class="lib-group-label">'+esc(c)+'</div><div class="vt-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:8px">'+cards+'</div>';
  }).join("");
}

/* ===== VITRINE UNIFICADA (galeria única = projetos concluídos + cases curados, 1 modelo) ===== */
var _SCV=null;
function _scvCaseByKey(){var m={};(_SCV.cases||[]).forEach(function(c){m[String(c.cid)]=c;});return m;}
function _scvItems(){
  var byKey=_scvCaseByKey(), used={}, itens=[];
  // 1) Projetos concluídos (carteira) — cada um é um case; enriquecido pelo case curado de mesmo cc.
  (_SCV.proj||[]).forEach(function(p){
    var c=byKey[String(p.cc)]; if(c)used[String(p.cc)]=1;
    itens.push({key:String(p.cc),titulo:(c&&c.titulo)||p.projeto||p.cc,cc:p.cc,area:(c&&c.area)||p.tipo||"",
      resumo:(c&&c.resumo)||"",isProj:true,proj:p,hasCase:!!c,publicado:c?Number(c.publicado):1,nprod:c?(c.produtos||0):0,ordem:c?(c.ordem||0):9999});
  });
  // 2) Cases curados sem projeto concluído correspondente (ex.: os cases-modelo da casa).
  (_SCV.cases||[]).forEach(function(c){
    if(used[String(c.cid)])return;
    itens.push({key:String(c.cid),titulo:c.titulo||c.cid,cc:c.cliente_cc||"",area:c.area||"",resumo:c.resumo||"",
      isProj:false,proj:null,hasCase:true,publicado:Number(c.publicado),nprod:c.produtos||0,ordem:c.ordem||0});
  });
  // Curados primeiro (por ordem), depois projetos (por cc).
  itens.sort(function(a,b){
    var ca=a.hasCase&&!a.isProj?0:1, cb=b.hasCase&&!b.isProj?0:1;
    if(ca!==cb)return ca-cb;
    if(ca===0)return (a.ordem||0)-(b.ordem||0);
    return String(a.cc).localeCompare(String(b.cc),undefined,{numeric:true});
  });
  return itens;
}
function _scvCard(it){
  var icon=it.isProj?'🗂️':'✨';
  var capa='<div class="vt-capa" style="height:72px;border-radius:10px 10px 0 0;background:linear-gradient(135deg,var(--brand,#1f7a3d),var(--brand-d,#155c2d));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem">'+icon+'</div>';
  var badge=_SCV.pode?(it.hasCase?(it.publicado?'<span class="tag s-APROVADO" style="font-size:.66rem">publicado</span>':'<span class="tag s-DEVOLVIDO" style="font-size:.66rem">rascunho</span>'):'<span class="tag" style="font-size:.66rem;opacity:.7">sem apresentação</span>'):'';
  var statusPill=it.isProj?_pill(it.proj.status):'';
  var chips='<div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap">'+(it.area?_vtTipoChipArea(it.area):'')+statusPill+badge+'</div>';
  var sub=esc(it.cc||'—')+(it.nprod?(' · '+it.nprod+' produto(s)'):'');
  return '<div class="card vt-card" style="padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column" data-key="'+esc(it.key)+'">'+capa+
    '<div style="padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1">'+chips+
      '<div style="font-weight:700;font-size:1rem;line-height:1.25">'+esc(it.titulo)+'</div>'+
      '<div class="muted" style="font-size:.76rem">'+sub+'</div>'+
      (it.resumo?'<p class="muted" style="font-size:.84rem;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">'+esc(it.resumo)+'</p>':'')+
    '</div></div>';
}
function _scvRender(){
  var el=_SCV.el, itens=_scvItems();
  var hint=_SCV.pode?'Clique num card para abrir a ficha. A gestão adiciona apresentação e produtos finais a qualquer um, e libera ao cliente.'

  var grid=itens.length?('<div class="vt-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">'+itens.map(_scvCard).join("")+'</div>')
                       :'<div class="card"><p class="muted" style="margin:0">Nenhum projeto concluído ou case ainda.</p></div>';
  el.innerHTML=_SCV.head+'<p class="muted">'+esc(hint)+'</p><div id="scv-box">'+grid+'</div>';

  if(box)box.querySelectorAll(".vt-card").forEach(function(card){card.onclick=function(){_scvFicha(card.getAttribute("data-key"));};});

function _scvFicha(key){

    var caso=j.caso||null, prods=j.produtos||[], pode=!!j.podeGerir;

      if(caso)bts.push('<button class="btn sm" type="button" id="scv-pub">'+(caso.publicado?'Despublicar':'Publicar')+'</button>');

      acoes='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px">'+bts.join("")+'</div>';
    }

             :(pode?'<div class="card"><p class="muted" style="margin:0">Sem apresentação ainda. Use “'+(caso?'Editar':'Adicionar')+' apresentação”.</p></div>':'');

      else{acao='<button class="btn sm sec scv-abrir" type="button" data-key="'+esc(key)+'" data-id="'+esc(p.id)+'">'+(p.tipo==="modelo3d"?"demonstrar ▶":p.tipo==="imagem"?"ver imagem":"abrir →")+'</button>';}
      var ed=pode?'<button class="btn sm scv-ped" type="button" data-id="'+esc(p.id)+'" style="margin-left:6px">editar</button>':'';
      var dl=pode?'<button class="btn sm danger scv-pdel" type="button" data-id="'+esc(p.id)+'" title="Remover" style="margin-left:6px">×</button>':'';
      return '<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:650;font-size:.92rem">'+m[0]+' '+esc(p.titulo)+'</div>'+(p.legenda?'<div class="muted" style="font-size:.8rem">'+esc(p.legenda)+'</div>':'')+'<div class="muted" style="font-size:.72rem">'+esc(m[1])+' · '+(p.fonte==="url"?"link externo":"acervo")+'</div><div style="margin-top:4px;display:flex;align-items:center;flex-wrap:wrap">'+acao+ed+dl+'</div></div>';
    }).join("");
    var addProd=pode?'<div style="margin:10px 0"><button class="btn sm" type="button" id="scv-pnovo">+ Adicionar produto final</button></div>':'';
    var galWrap='<h3 style="font-size:1.02rem;margin:18px 0 8px">Produtos finais</h3>'+addProd+
      (prods.length?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">'+galeria+'</div>':'<p class="muted" style="margin:0">Nenhum produto final anexado ainda.'+(pode?' Use “Adicionar produto final”.':'')+'</p>');
    // Entregáveis + andamento do projeto (quando é um projeto da carteira)

      var a=(_SCV.andam||{})[proj.cc],prog="";

/* E.C.T.P = empresa.cliente.tipo.projeto. Decompõe um centro de custo. */
function _ectp(cc){var a=String(cc||"").split(".");return{e:a[0]||"",c:a[1]||"",t:a[2]||"",p:parseInt(a[3],10)||0,pre3:a.slice(0,3).join("."),pre2:a.slice(0,2).join(".")};}
/* Mapa de nomes: "empresa.cliente" -> nome do cliente; "empresa" -> nome da empresa. */
function _cadNomes(){var cli={},emp={};(projList()||[]).forEach(function(p){var k=_ectp(p.cc);if(k.c&&p.cliente)cli[k.e+"."+k.c]=p.cliente;if(k.e&&p.empresa)emp[k.e]=p.empresa;});return{cli:cli,emp:emp};}
/* Último projeto (maior nº) e próximo sugerido para um prefixo empresa.cliente.tipo. */
function _proximoCC(pre3){var max=0,ult="",nome="",qtd=0;(projList()||[]).forEach(function(p){var k=_ectp(p.cc);if(k.pre3===pre3){qtd++;if(k.p>=max){max=k.p;ult=p.cc;nome=p.projeto;}}});return{ultimo:ult,ultimoNome:nome,prox:pre3+"."+(max+1),qtd:qtd,max:max};}

function _cadTabela(){
  const stOpts=s=>["A INICIAR","EM ANDAMENTO","EM ESPERA","CONCLUÍDO","CANCELADO"].map(x=>`<option${String(s||"").toUpperCase()===x?" selected":""}>${x}</option>`).join("");
  const respMap={}; (state.data.projx||[]).forEach(x=>{if(x&&x.resp)respMap[x.cc]=x.resp;});
  const g=id=>{var e=$("#"+id);return e?String(e.value||""):"";};
  const q=g("cad-fq").trim().toLowerCase(), st=g("cad-fstatus"), cli=g("cad-fcli");
  const proj=projList().filter(p=>{
    if(q){var hay=(p.cc+" "+p.projeto+" "+(p.cliente||"")+" "+(p.subtipo||"")).toLowerCase();if(hay.indexOf(q)<0)return false;}
    if(st && String(p.status||"").toUpperCase()!==st.toUpperCase())return false;
    if(cli && String(p.cliente||"")!==cli)return false;
    return true;
  });
  const linhas=proj.map(p=>`<tr>
    <td>${esc(p.cc)}</td>
    <td>${esc(p.projeto)}${p.subtipo?`<div class="muted" style="font-size:.8rem">${esc(p.subtipo)}</div>`:""}</td>
    <td>${esc(p.cliente||"—")}</td>
    <td>${esc(respMap[p.cc]||"—")}</td>
    <td><select class="cad-st" data-cc="${esc(p.cc)}">${stOpts(p.status)}</select></td>
  </tr>`).join("");
  return `<div class="muted" style="font-size:.82rem;margin-bottom:6px">${proj.length} de ${projList().length} projetos</div>
    <table><thead><tr><th>Centro de custo</th><th>Projeto</th><th>Cliente</th><th>Responsável</th><th>Status</th></tr></thead>
    <tbody>${linhas||'<tr><td colspan="5" class="muted center" style="padding:22px">Nenhum projeto no filtro.</td></tr>'}</tbody></table>`;
}
function _renderCadTab(){var el=$("#cad-tab");if(!el)return;el.innerHTML=_cadTabela();
  el.querySelectorAll(".cad-st").forEach(sl=>sl.onchange=async()=>{
    try{ await api("setstatus",{cc:sl.dataset.cc,status:sl.value}); await carregarState(); toast("Status atualizado."); _renderCadTab(); }
    catch(e){ toast("Erro: "+e.message); }
  });
}
function _renderNx(){
  var out=$("#nx-out"), sel=$("#nx-cli"); if(!out||!sel)return;
  var pre2=sel.value; if(!pre2){out.innerHTML="";return;}
  var tipos={};
  (projList()||[]).forEach(function(p){var k=_ectp(p.cc);if(k.pre2===pre2&&k.t){ (tipos[k.t]=tipos[k.t]||[]).push(p); }});
  var ks=Object.keys(tipos).sort(function(a,b){return (parseInt(a,10)||0)-(parseInt(b,10)||0);});
  if(!ks.length){out.innerHTML='<p class="muted" style="font-size:.84rem">Sem projetos para este cliente.</p>';return;}
  var rows=ks.map(function(t){var info=_proximoCC(pre2+"."+t);
    return `<tr><td>${esc(t)}</td><td>${info.qtd}</td><td>${esc(info.ultimo)}<div class="muted" style="font-size:.78rem">${esc(info.ultimoNome||"—")}</div></td><td><b>${esc(info.prox)}</b> <button class="btn sec sm nx-usar" data-cc="${esc(info.prox)}" style="margin-left:6px">usar</button></td></tr>`;
  }).join("");
  out.innerHTML=`<table style="margin-top:8px"><thead><tr><th>Tipo</th><th>Qtd</th><th>Último E.C.T.P</th><th>Próximo sugerido</th></tr></thead><tbody>${rows}</tbody></table>`;
  out.querySelectorAll(".nx-usar").forEach(b=>b.onclick=function(){var i=$("#cad-cc");if(i){i.value=b.dataset.cc;_cadSugerir();i.focus();}toast("Centro de custo preenchido: "+b.dataset.cc);});
}
function _cadSugerir(){
  var i=$("#cad-cc"), out=$("#cad-sugestao"); if(!i||!out)return;
  var k=_ectp(i.value.trim());
  if(!k.e||!k.c||!k.t){out.innerHTML="Informe ao menos empresa.cliente.tipo (ex.: 1.25.2) para ver o próximo código.";return;}
  var N=_cadNomes(), nome=N.cli[k.e+"."+k.c]||"", info=_proximoCC(k.pre3);
  if(info.qtd){out.innerHTML=`Cliente <b>${esc(nome||k.pre2)}</b> · tipo ${esc(k.t)}: ${info.qtd} projeto(s); último <b>${esc(info.ultimo)}</b>. Próximo sugerido: <b>${esc(info.prox)}</b>.`;}
  else{out.innerHTML=`Nenhum projeto ainda em ${esc(k.pre3)}${nome?` (${esc(nome)})`:""}. Primeiro código sugerido: <b>${esc(k.pre3)}.1</b>.`;}
}
function ligaCadastro(){
  const b=$("#cad-btn");
  if(b) b.onclick=async()=>{
    const msg=$("#cad-msg");msg.textContent="";
    const proj={cc:$("#cad-cc").value.trim(),projeto:$("#cad-nome").value.trim(),subtipo:$("#cad-subtipo").value.trim(),status:$("#cad-status").value,inicio:$("#cad-inicio").value,previsto:$("#cad-previsto").value};

  _renderCadTab();
}

/* ===================== DAILY BRIEF — radar com triagem por IA =====================
   Feed executivo estilo Daily Brief: cards com resumo, Impact Score, tags/área, fonte, data
   e link. Abas Editais/Notícias/Todos + filtro por área e score. A fronteira é o SERVIDOR
   (ações brief/briefadd/briefdel): o front só renderiza o que a API devolveu; o formulário
   de adicionar só aparece para quem o servidor marcou podeGerir. Sem valor monetário. */
var BRIEFF={view:"feed",categoria:"",area:"",scoremin:0,q:"",de:"",ate:"",origem:""};
var BRIEF_AREAS_LBL={san:"Saneamento / Meio Ambiente",min:"Mineração",pd:"P&D / Fomento",bio:"Biogás / Bioeconomia"};
var BRIEF_CAT_LBL={noticia:"Notícia do setor",edital:"Edital",artigo:"Artigo científico",licenciamento:"Licenciamento ambiental",outro:"Outros"};
var BRIEF_CAD_LBL={diaria:"Diária",semanal:"Semanal",mensal:"Mensal"};
var BRIEF_TF_LBL={rss:"RSS / Atom (feed)",json:"JSON (feed)",html:"Página HTML (1 item)"};
function _briefScoreCls(s){s=Number(s)||0;return s>=70?"is-alto":(s>=40?"is-medio":"is-baixo");}
function _briefAreaTags(area){
  return String(area||"").split(/[\s,;]+/).filter(Boolean).map(function(a){
    return '<span class="brief-area brief-area-'+esc(a)+'">'+esc(BRIEF_AREAS_LBL[a]||a)+'</span>';
  }).join("");
}
function _briefDataBr(d){return /^\d{4}-\d{2}-\d{2}/.test(String(d||""))?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):esc(d||"");}
function _briefCatDe(it){var c=String(it.categoria||"").toLowerCase();if(BRIEF_CAT_LBL[c])return c;return it.tipo==="edital"?"edital":"noticia";}
function _briefCard(it,podeGerir){
  var cat=_briefCatDe(it),catLbl=BRIEF_CAT_LBL[cat]||"Notícia";
  var dataBr=_briefDataBr(it.data);
  var fonte=it.fonte?esc(it.fonte):"—";
  var aTriar=String(it.sit||"")==="A_TRIAR";
  var auto=String(it.origem||"")==="auto";
  var score=aTriar?'<span class="brief-score is-triar" title="Triagem da IA pendente — rode a coleta de novo ou triе manualmente">a triar</span>'
                  :'<span class="brief-score '+_briefScoreCls(it.score)+'" title="Impact Score de relevância para os focos da casa"><b>'+(Number(it.score)||0)+'</b><span>Impact</span></span>';
  var tags=String(it.tags||"").split(/\s*,\s*/).filter(Boolean).slice(0,6).map(function(t){return '<span class="tag tag-brand">'+esc(t)+'</span>';}).join("");

function carregarBrief(){
  BRIEFF.view="feed";_briefNav(true);
  var wrap=document.getElementById("brief-wrap");if(!wrap)return;
  api("brief",{categoria:BRIEFF.categoria,area:BRIEFF.area,scoremin:BRIEFF.scoremin,q:BRIEFF.q,de:BRIEFF.de,ate:BRIEFF.ate,origem:BRIEFF.origem}).then(function(j){
    var itens=j.itens||[],podeGerir=!!j.podeGerir;
    _briefNav(podeGerir);
    var alto=itens.filter(function(x){return (Number(x.score)||0)>=70;}).length;
    var autos=itens.filter(function(x){return String(x.origem||"")==="auto";}).length;
    var kpis='<div class="kpis"><div class="kpi"><div class="v" style="color:var(--brand)">'+itens.length+'</div><div class="l">No radar</div></div>'+
      '<div class="kpi"><div class="v" style="color:var(--ok)">'+alto+'</div><div class="l">Alta relevância (≥70)</div></div>'+
      '<div class="kpi"><div class="v">'+autos+'</div><div class="l">Coletados por fonte</div></div></div>';
    var lista=itens.length?('<div class="brief-feed">'+itens.map(function(it){return _briefCard(it,podeGerir);}).join("")+'</div>')
      :'<div class="card"><p class="muted" style="margin:0">Nada no radar com estes filtros.'+(podeGerir?' Cadastre fontes em “Fontes &amp; agenda” ou use “+ Adicionar manualmente”.':'')+'</p></div>';
    wrap.innerHTML=(podeGerir?_briefColetaBanner(j.coleta):"")+_briefFiltrosHtml(podeGerir)+kpis+lista;
    ligaBrief(podeGerir);
  }).catch(function(e){wrap.innerHTML='<p class="err" style="padding:14px">Não foi possível carregar: '+esc(e.message||e)+'</p>';});
}
function ligaBrief(podeGerir){
  var wrap=document.getElementById("brief-wrap");if(!wrap)return;
  wrap.querySelectorAll("[data-brieftab]").forEach(function(b){b.onclick=function(){BRIEFF.categoria=b.getAttribute("data-brieftab");carregarBrief();};});
  var qb=document.getElementById("brief-q-btn"),qi=document.getElementById("brief-q");
  if(qb)qb.onclick=function(){BRIEFF.q=(qi&&qi.value||"").trim();carregarBrief();};
  if(qi)qi.addEventListener("keydown",function(e){if(e.key==="Enter"){BRIEFF.q=qi.value.trim();carregarBrief();}});
  var as=document.getElementById("brief-area");if(as)as.onchange=function(){BRIEFF.area=as.value;carregarBrief();};
  var ss=document.getElementById("brief-score");if(ss)ss.onchange=function(){BRIEFF.scoremin=Number(ss.value)||0;carregarBrief();};
  var os=document.getElementById("brief-origem");if(os)os.onchange=function(){BRIEFF.origem=os.value;carregarBrief();};
  var dd=document.getElementById("brief-de");if(dd)dd.onchange=function(){BRIEFF.de=dd.value;carregarBrief();};
  var da=document.getElementById("brief-ate");if(da)da.onchange=function(){BRIEFF.ate=da.value;carregarBrief();};
  wrap.querySelectorAll("[data-briefdel]").forEach(function(b){b.onclick=function(){
    if(!confirm("Remover este item do brief?"))return;
    b.disabled=true;
    api("briefdel",{id:b.getAttribute("data-briefdel")}).then(function(){toast("Item removido do brief.");carregarBrief();})
      .catch(function(e){toast(e.message||"Falha ao remover.");b.disabled=false;});
  };});
  if(podeGerir){
    var fb=document.getElementById("brief-f-btn");
    if(fb)fb.onclick=function(){
      var cat=(document.getElementById("brief-f-cat")||{}).value||"noticia";
      var url=((document.getElementById("brief-f-url")||{}).value||"").trim();
      var titulo=((document.getElementById("brief-f-titulo")||{}).value||"").trim();
      var texto=((document.getElementById("brief-f-texto")||{}).value||"").trim();
      var msg=document.getElementById("brief-f-msg");
      if(!url&&!texto){if(msg){msg.textContent="Informe a URL ou cole o texto.";msg.className="err";}return;}
      fb.disabled=true;if(msg){msg.textContent="Triando… a IA está lendo e pontuando.";msg.className="muted";}
      api("briefadd",{categoria:cat,url:url,titulo:titulo,texto:texto}).then(function(j){
        toast(j.triado?("Adicionado ao brief · Impact "+j.score):"Adicionado (triagem pendente, marcado “a triar”).");
        BRIEFF.categoria="";BRIEFF.area="";BRIEFF.scoremin=0;BRIEFF.q="";BRIEFF.origem="";BRIEFF.de="";BRIEFF.ate="";
        carregarBrief();
      }).catch(function(e){if(msg){msg.textContent=e.message||"Falha ao adicionar.";msg.className="err";}fb.disabled=false;});
    };
  }
}

function _bfVal(id){var el=document.getElementById(id);return el?el.value:"";}
function ligaFontes(){
  var save=document.getElementById("bf-save");

    var msg=document.getElementById("bf-msg");

    var body={id:_bfVal("bf-id"),nome:nome,url:_bfVal("bf-url").trim(),categoria:_bfVal("bf-cat"),tipo_fonte:_bfVal("bf-tf"),

      ativo:(document.getElementById("bf-ativo")||{}).checked?1:0};

      .catch(function(e){if(msg){msg.textContent=e.message||"Falha ao salvar.";msg.className="err";}save.disabled=false;});
  };

  };
  document.querySelectorAll("[data-fontecolher]").forEach(function(b){b.onclick=function(){
    b.disabled=true;var o=b.textContent;b.textContent="Coletando…";
    api("briefrun",{id:b.getAttribute("data-fontecolher")}).then(function(j){toast("Fonte colhida: "+j.novos+" novo(s).");carregarFontes();})
      .catch(function(e){toast(e.message||"Falha.");b.disabled=false;b.textContent=o;});

  document.querySelectorAll("[data-fontedel]").forEach(function(b){b.onclick=function(){

      .catch(function(e){toast(e.message||"Falha ao remover.");b.disabled=false;});
  };});
  document.querySelectorAll("[data-fonteedit]").forEach(function(b){b.onclick=function(){
    var f={};try{f=JSON.parse(decodeURIComponent(b.getAttribute("data-fonteedit")));}catch(e){}

    set("bf-id",f.id);set("bf-nome",f.nome);set("bf-url",f.url);set("bf-cat",String(f.categoria||"noticia").toLowerCase());
    set("bf-tf",String(f.tipo_fonte||"rss").toLowerCase());set("bf-cad",String(f.cadencia||"semanal").toLowerCase());
    set("bf-area",String(f.area||""));set("bf-sel",f.seletor);
    var a=document.getElementById("bf-ativo");if(a)a.checked=!!Number(f.ativo);
    var det=document.getElementById("brief-fonte-det");if(det)det.open=true;
    var msg=document.getElementById("bf-msg");if(msg){msg.textContent="Editando: "+(f.nome||f.id);msg.className="muted";}
    if(det&&det.scrollIntoView)det.scrollIntoView({behavior:"smooth",block:"nearest"});
  };});

/* Navegador de pastas do bucket-fonte do acervo (ação 'acervo_list'). Abrir arquivo → mesma

function _acArquivos(prefix){
  var box=document.getElementById("ac-files"),cr=document.getElementById("ac-crumb");if(!box)return;

      var parts=pref.split("/").filter(Boolean),acc="",crumbs='<button class="linkbtn" data-nav="" style="background:none;border:0;cursor:pointer;padding:0;font:inherit">Acervo</button>';
      parts.forEach(function(seg){acc+=seg+"/";crumbs+=' / <button class="linkbtn" data-nav="'+esc(acc)+'" style="background:none;border:0;cursor:pointer;padding:0;font:inherit">'+esc(seg)+'</button>';});
      cr.innerHTML=crumbs;cr.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){_acArquivos(b.getAttribute("data-nav"));};});

    var arqs=(j.arquivos||[]).map(function(a){var kb=a.tam?(' <span class="muted" style="font-size:.7rem">· '+(a.tam>1048576?((a.tam/1048576).toFixed(1)+" MB"):Math.max(1,Math.round(a.tam/1024))+" KB")+'</span>'):'';return '<div class="lib-card"><div class="lib-title" style="font-size:.9rem">📄 '+esc(a.nome)+kb+'</div><div class="lib-act"><button class="linkbtn" data-ab="'+esc(a.key)+'" style="background:none;border:0;cursor:pointer;padding:0;font:inherit">abrir →</button></div></div>';}).join("");
    if(!pastas&&!arqs){box.innerHTML='<p class="muted" style="margin:0">Pasta vazia.</p>';return;}
    box.innerHTML='<div class="lib-grid">'+pastas+arqs+'</div>';

function buscaAcervo(){
  var q=document.getElementById("ac-q").value.trim(), r=document.getElementById("ac-res");
  if(!q){r.innerHTML="";return;}
  r.innerHTML='<p class="muted">Buscando…</p>';
  api("acervo_busca",{q:q}).then(function(j){
    var hits=j.hits||[];
    if(!hits.length){r.innerHTML='<p class="muted">Nada encontrado.</p>';return;}
    r.innerHTML=hits.map(function(h){
      var ab=h.arquivo?' <button class="linkbtn" data-ab="'+esc(h.arquivo)+'" style="background:none;border:0;cursor:pointer;padding:0;font:inherit">abrir →</button>':'';
      return '<div class="ac-hit"><div class="ac-hit-h">'+esc(h.arquivo||"")+' <span class="ac-hit-s">· '+(Math.round((h.score||0)*100)/100)+'</span>'+ab+'</div><div class="ac-hit-t">'+esc((h.trecho||"").slice(0,600))+'…</div></div>';
    }).join("");
    r.querySelectorAll("[data-ab]").forEach(function(b){b.onclick=function(){abrirAcervoArquivo(b.getAttribute("data-ab"),b);};});
  }).catch(function(e){r.innerHTML='<p class="err" style="padding:8px 0">'+esc(e.message||e)+'</p>';});

/* Abre um arquivo do Acervo: POST autenticado (token no corpo) → blob → nova aba. Nunca põe o
   token nem o caminho confidencial na URL de navegação; o blob vive só na sessão do navegador. */
function abrirAcervoArquivo(path,btn){
  if(!path)return;var txt=btn?btn.textContent:"";if(btn){btn.textContent="abrindo…";btn.disabled=true;}
  fetch(BASE+"/acervo/arquivo",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({path:path})})
    .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||("HTTP "+r.status));});return r.blob();})
    .then(function(b){var u=URL.createObjectURL(b);window.open(u,"_blank","noopener");setTimeout(function(){URL.revokeObjectURL(u);},60000);})
    .catch(function(e){toast("Não foi possível abrir: "+(e.message||e));})
    .then(function(){if(btn){btn.textContent=txt||"abrir →";btn.disabled=false;}});
}

function _vtAbrirProd(cid,id,btn){

  fetch(BASE+"/vitrine/arquivo",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({cid:cid,id:id})})
    .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||("HTTP "+r.status));});return r.blob();})

/* Desenha o cérebro: hub (Casa) + lóbulos (áreas) + procedimentos + recursos (existe/criar). */
function _escCerebro(){
  var areas=ESCCER.areas||[],W=1060,H=820,cx=W/2,cy=H/2,rx=360,ry=300,N=areas.length;
  var links="",lobes="",nodes="",labels="";

    var ang=(-Math.PI/2)+i*(2*Math.PI/N),gx=cx+rx*Math.cos(ang),gy=cy+ry*Math.sin(ang),cor=_ESC_CORES[a.cor]||"var(--brand)";
    var mx=(cx+gx)/2+Math.cos(ang+Math.PI/2)*26,my=(cy+gy)/2+Math.sin(ang+Math.PI/2)*26;
    links+='<path d="M'+cx+' '+cy+' Q'+mx.toFixed(0)+' '+my.toFixed(0)+' '+gx.toFixed(0)+' '+gy.toFixed(0)+'" fill="none" stroke="'+cor+'" stroke-width="2.5" opacity=".5"/>';

    var prs=a.procedimentos||[],mp=prs.length;
    prs.forEach(function(pr,j){
      var sp=Math.min(1.3,0.4+mp*0.18),a2=ang+(mp>1?(-sp/2+j*(sp/(mp-1))):0),dist=78;
      var px2=gx+dist*Math.cos(a2),py2=gy+dist*Math.sin(a2);
      links+='<line x1="'+gx.toFixed(0)+'" y1="'+gy.toFixed(0)+'" x2="'+px2.toFixed(0)+'" y2="'+py2.toFixed(0)+'" stroke="'+cor+'" stroke-width="1.3" opacity=".4"/>';
      var hollow=(pr.estado!=="existe");
      nodes+='<circle data-esc="proc:'+i+':'+j+'" data-sw="'+(hollow?1.5:1)+'" cx="'+px2.toFixed(0)+'" cy="'+py2.toFixed(0)+'" r="9" fill="'+(hollow?"var(--surface)":cor)+'" stroke="'+cor+'" stroke-width="'+(hollow?1.5:1)+'" stroke-dasharray="'+(hollow?"3 2":"0")+'" style="cursor:pointer"><title>'+esc(pr.nome)+'</title></circle>';
    });
    // recursos (sinapses pequenas) mais para fora
    var rcs=a.recursos||[],mr=rcs.length;
    rcs.forEach(function(rc,j){
      var sp=Math.min(1.6,0.5+mr*0.2),a2=ang+(mr>1?(-sp/2+j*(sp/(mr-1))):0),dist=150;
      var px2=gx+dist*Math.cos(a2),py2=gy+dist*Math.sin(a2);
      links+='<line x1="'+gx.toFixed(0)+'" y1="'+gy.toFixed(0)+'" x2="'+px2.toFixed(0)+'" y2="'+py2.toFixed(0)+'" stroke="'+cor+'" stroke-width="0.8" opacity=".3"/>';
      var criar=(rc.estado==="criar");
      nodes+='<circle data-esc="rec:'+i+':'+j+'" data-sw="'+(criar?1.5:1)+'" cx="'+px2.toFixed(0)+'" cy="'+py2.toFixed(0)+'" r="6" fill="'+(criar?"var(--surface)":cor)+'" stroke="'+cor+'" stroke-width="'+(criar?1.5:1)+'" stroke-dasharray="'+(criar?"2 2":"0")+'" style="cursor:pointer"><title>'+esc(rc.nome)+(criar?" (a criar)":"")+'</title></circle>';
    });
    lobes+='<circle data-esc="area:'+i+'" data-sw="1" cx="'+gx.toFixed(0)+'" cy="'+gy.toFixed(0)+'" r="30" fill="'+cor+'" opacity=".92" style="cursor:pointer"><title>'+esc(a.area)+'</title></circle>';
    var ly=gy>cy?gy+46:gy-38;
    labels+='<text x="'+gx.toFixed(0)+'" y="'+ly.toFixed(0)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">'+esc(a.area)+'</text>';
  });
  var hub='<circle cx="'+cx+'" cy="'+cy+'" r="50" fill="var(--brand)"/>'
    +'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Intelecto</text>'
    +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="10" fill="#fff" opacity=".9">&amp; CSTR</text>'
    +'<text x="'+cx+'" y="'+(cy+27)+'" text-anchor="middle" font-size="8.5" fill="#fff" opacity=".8">POP-ENG · Crivo A–F</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:760px;height:auto;display:block">'+links+nodes+lobes+labels+hub+'</svg>';
}

    api("ambFacets",{bank:AMB.bank,bacia:AMB.bacia,keys:keys}).then(function(j){
      AMB.facets=j.facets||{}; AMB.facetKey=ck; _ambRenderFiltros();

/* Download do recorte FILTRADO (server-side, todas as linhas até 50k) em CSV/GeoJSON/KML,
   montado no cliente a partir dos mesmos campos exibidos. Mantém o padrão do painel por bacia. */
function _ambDownload(fmt,btn){
  var cfg=_ambEffCols(); var cols=cfg.map(function(c){return c[0];});
  var old=btn?btn.textContent:""; if(btn){btn.disabled=true;btn.textContent="…";}
  api("ambExport",_ambParams({cols:cols,max:50000})).then(function(j){
    var rows=j.rows||[]; var base="leads_"+AMB.bank+(AMB.bacia?("_"+AMB.bacia):"");
    if(fmt==="csv")_ambDL(base+".csv","text/csv;charset=utf-8",_ambCSV(rows,cfg));
    else if(fmt==="kml")_ambDL(base+".kml","application/vnd.google-earth.kml+xml",_ambKML(rows,cfg,base));
    else _ambDL(base+".geojson","application/geo+json",_ambGeo(rows,cfg));
    if(btn){btn.disabled=false;btn.textContent=old;}
    if(j.truncated)toast("Recorte grande: baixadas as primeiras "+(j.cap||50000).toLocaleString("pt-BR")+" linhas. Refine o filtro p/ o recorte exato.");
  }).catch(function(e){if(btn){btn.disabled=false;btn.textContent=old;}toast("Falha no download: "+(e.message||e));});
}
function _ambDL(name,mime,text){var b=new Blob([text],{type:mime});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},120);}
function _ambCSV(rows,cols){var qq=function(v){v=(v==null?"":String(v));return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var lines=[cols.map(function(c){return c[1];}).join(";")];
  rows.forEach(function(r){lines.push(cols.map(function(c){return qq(r[c[0]]);}).join(";"));});
  return "﻿"+lines.join("\r\n");}
function _ambGeo(rows,cols){var feats=rows.filter(function(r){return r.c&&r.c.length===2&&r.c[0]!=null&&r.c[1]!=null;}).map(function(r){var pr={};cols.forEach(function(c){pr[c[1]]=r[c[0]];});return {type:"Feature",geometry:{type:"Point",coordinates:[r.c[0],r.c[1]]},properties:pr};});
  return JSON.stringify({type:"FeatureCollection",name:"Intelecto_leads",crs:{type:"name",properties:{name:"urn:ogc:def:crs:EPSG::4674"}},features:feats});}
function _ambKML(rows,cols,name){var q=function(s){return (s==null?"":String(s)).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};
  var tk=(cols[1]||cols[0]||["m"])[0];
  var k='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+q(name)+'</name>';
  rows.filter(function(r){return r.c&&r.c.length===2&&r.c[0]!=null&&r.c[1]!=null;}).forEach(function(r){var desc=cols.map(function(c){return c[1]+": "+(r[c[0]]==null?"":r[c[0]]);}).join("\n");
    k+='<Placemark><name>'+q(r[tk]||r.m||"")+'</name><description>'+q(desc)+'</description><Point><coordinates>'+r.c[0]+','+r.c[1]+',0</coordinates></Point></Placemark>';});
  return k+'</Document></kml>';}

function _ambMapRefresh(){

  }).catch(function(){});

  }).catch(function(e){

function _crmRenderPainel(){
  var box=document.getElementById("crm-painel-box");if(!box||!CRMDATA)return;
  var deals=CRMDATA.deals||[];
  var hoje=new Date().toISOString().slice(0,10), ym=hoje.slice(0,7);
  var noMes=function(d){return d&&String(d).slice(0,7)===ym;};
  // Ritmo × meta do mês corrente
  var leadsNovos=deals.filter(function(d){return noMes(d.entry);}).length;
  var propostas=deals.filter(function(d){return noMes(d.sentdate);}).length;
  var fechados=deals.filter(function(d){return noMes(d.signeddate);});
  var vendas=fechados.reduce(function(s,d){return s+(Number(d.val)||0);},0);
  var negoc=deals.filter(function(d){return _crmMacro(d.st)===CRM_MACRO[3];}).length;
  var qualif=deals.filter(function(d){var m=_crmMacro(d.st);return m&&m!==CRM_MACRO[0];}).length;
  var meta=function(lbl,atual,alvo,isMoney){
    var pct=alvo>0?Math.round(atual/alvo*100):0;
    var cor=pct>=100?"var(--ok,#1f7a3d)":pct>=60?"var(--warn)":"var(--crit)";
    var av=isMoney?fmtBRL(atual):atual, al=isMoney?fmtBRL(alvo):alvo;
    return '<div class="kpi" style="align-items:flex-start"><div class="v">'+av+'</div><div class="l">'+lbl+'</div>'
      +'<div style="width:100%;height:6px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden"><div style="height:100%;width:'+Math.min(100,pct)+'%;background:'+cor+'"></div></div>'
      +'<div class="muted" style="font-size:.7rem;margin-top:3px">meta '+al+' · '+pct+'%</div></div>';
  };
  var kpis='<h3 style="font-size:1rem;margin:10px 0 6px">Ritmo × meta — '+nomeMesLongo(ym.slice(5,7))+'/'+ym.slice(0,4)+'</h3>'
    +'<div class="kpis">'+meta("Leads novos",leadsNovos,CRM_METAS.leads)+meta("Qualificados (no funil)",qualif,CRM_METAS.qualif)+meta("Propostas enviadas",propostas,CRM_METAS.prop)+meta("Negociações",negoc,CRM_METAS.negoc)+meta("Fechados",fechados.length,CRM_METAS.fech)+meta("Vendas",vendas,CRM_METAS.vendas,true)+'</div>';
  // Fila de decisões: ações com data (nextdate) vencidas ou a vencer em 7 dias; e deals sem próxima ação
  var em7=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  var comAcao=deals.filter(function(d){return d.nextdate&&d.next;});
  var vencidas=comAcao.filter(function(d){return d.nextdate<hoje;}).sort(function(a,b){return String(a.nextdate).localeCompare(b.nextdate);});
  var aVencer=comAcao.filter(function(d){return d.nextdate>=hoje&&d.nextdate<=em7;}).sort(function(a,b){return String(a.nextdate).localeCompare(b.nextdate);});
  var semAcao=deals.filter(function(d){return (!d.nextdate||!d.next)&&_crmMacro(d.st)&&_crmMacro(d.st)!==CRM_MACRO[5];});
  var linha=function(d,tag){return '<div class="crm-row" data-id="'+esc(d.id)+'" style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer">'
    +(tag||'')+'<div style="flex:1"><b style="font-size:.9rem">'+esc(d.co||d.id)+'</b>'+(d.next?'<div class="muted" style="font-size:.8rem">'+esc(String(d.next).slice(0,90))+'</div>':'')+'</div>'
    +'<div class="muted" style="font-size:.76rem;white-space:nowrap">'+esc(d.nextdate||'')+(d.owner?' · '+esc(d.owner):'')+'</div></div>';};
  var secao=function(tit,arr,cor){
    if(!arr.length)return '';
    return '<h3 style="font-size:.95rem;margin:16px 0 4px">'+tit+' <span class="muted" style="font-weight:400">('+arr.length+')</span></h3>'
      +'<div class="card" style="padding:4px 14px">'+arr.slice(0,25).map(function(d){return linha(d,cor?'<span class="tag" style="font-size:.64rem;background:'+cor+';color:#fff">●</span>':'');}).join("")+'</div>';
  };
  box.innerHTML=kpis
    +secao("🔴 Ações vencidas",vencidas,"var(--crit)")
    +secao("🟡 A vencer (7 dias)",aVencer,"var(--warn)")
    +secao("⚪ Sem próxima ação definida",semAcao,"")
    +((!vencidas.length&&!aVencer.length&&!semAcao.length)?'<p class="muted" style="padding:14px">Nenhuma ação pendente.</p>':'');
  box.querySelectorAll(".crm-row").forEach(function(tr){tr.onclick=function(){_crmDealDetail(tr.getAttribute("data-id"));};});
}

  var deals=CRMDATA.deals||[], funil=CRMDATA.funil||{};
  var totN=deals.length;

  var vendas=assin.reduce(function(s,d){return s+(Number(d.val)||0);},0);
  var emAberto=deals.filter(function(d){return d.sentdate&&!d.signeddate;});
  var valAberto=emAberto.reduce(function(s,d){return s+(Number(d.val)||0);},0);
  var kpis='<div class="kpis">'
