function viewInicio(){
  /* Início por papel — a rota vem do SERVIDOR (state.coord/state.papel, de auth()); a UI não
     é a fronteira. Coordenação/Admin: RESUMO EXECUTIVO da engenharia. Equipe: Painel do Dia. */
  if(state.coord) return viewInicioExec();
  var meu=(state.data.lanc||[]).filter(function(r){return r.slug===state.slug});
  var mes=hoje().slice(0,7);
  var hMes=meu.filter(function(r){return String(r.d).slice(0,7)===mes}).reduce(function(s,r){return s+Number(r.h)},0);
  var seg=segundaDe(hoje()), dom=somaDias(seg,6);
  var hSem=meu.filter(function(r){return r.d>=seg&&r.d<=dom}).reduce(function(s,r){return s+Number(r.h)},0);
  var pend=meu.filter(function(r){return r.s==="PENDENTE"}).length;
  var dev=meu.filter(function(r){return r.s==="DEVOLVIDO"}).length;
  /* Projetos ativos */
  var proj=state.data.proj||[];
  var ativos=proj.filter(function(p){return ["EM ANDAMENTO","A INICIAR"].indexOf(String(p.status||"").toUpperCase())>=0}).length;
  var concl=proj.filter(function(p){return String(p.status||"").toUpperCase().indexOf("CONCLU")>=0}).length;
  /* Horas por dia da semana */
  var diasNome=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  var diasH=[0,0,0,0,0,0,0];
  meu.filter(function(r){return r.d>=seg&&r.d<=dom}).forEach(function(r){
    var d=new Date(r.d+"T00:00:00"); var w=(d.getDay()+6)%7; diasH[w]+=Number(r.h);
  });
  var maxH=Math.max.apply(null,diasH.concat([8]));
  var barras=diasH.map(function(h,i){
    var pct=Math.round(h/maxH*100);
    var cor=h>=8?"var(--ok)":h>0?"var(--brand)":"var(--line)";
    return '<div style="text-align:center;flex:1">'+
      '<div style="height:80px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">'+
        '<div style="width:24px;background:'+cor+';border-radius:4px 4px 0 0;height:'+pct+'%;min-height:2px;transition:height 0.6s ease '+(i*0.08)+'s"></div>'+
      '</div>'+
      '<div style="font-size:.68rem;color:var(--muted);margin-top:4px">'+diasNome[i]+'</div>'+
      '<div style="font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums">'+(h>0?fmtH(h):"-")+'</div>'+
    '</div>';
  }).join("");
  /* O panorama da Coordenação/Admin mudou para o Resumo Executivo (viewInicioExec), roteado
     no topo desta função por state.coord. Aqui segue só o Painel do Dia pessoal da Equipe. */
  return '<div class="animate-in">'+
    '<p class="muted" style="margin-bottom:18px">Resumo das suas atividades e indicadores do portal.</p>'+
    '<div class="kpis">'+
      '<div class="kpi" data-go="apont" title="Ver apontamentos" style="cursor:pointer"><div class="v" style="color:var(--brand)">'+fmtH(hSem)+'</div><div class="l">Horas nesta semana</div></div>'+
      '<div class="kpi" data-go="apont" title="Ver apontamentos" style="cursor:pointer"><div class="v">'+fmtH(hMes)+'</div><div class="l">Horas no mês</div></div>'+
      '<div class="kpi" data-go="apont" title="Ver apontamentos" style="cursor:pointer"><div class="v"'+(pend>0?' style="color:var(--warn)"':'')+'>'+ pend+'</div><div class="l">Lançamentos pendentes</div></div>'+
      (dev?'<div class="kpi" data-go="apont" title="Ver apontamentos" style="cursor:pointer"><div class="v" style="color:var(--crit)">'+dev+'</div><div class="l">Devolvidos para ajuste</div></div>':'')+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card">'+
        '<h3 style="font-size:.88rem;margin-bottom:10px">Horas por dia — semana atual</h3>'+
        '<div style="display:flex;gap:4px;align-items:flex-end">'+barras+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<h3 style="font-size:.88rem;margin-bottom:14px">Acesso rápido</h3>'+
        '<div style="display:flex;flex-direction:column;gap:8px">'+
          '<button class="btn" data-go="lancar" style="width:100%">⏱️ Lançar horas</button>'+
          '<button class="btn sec" data-go="apont" style="width:100%">📄 Ver apontamentos</button>'+
          '<button class="btn sec" data-go="projetos" style="width:100%">📁 Projetos</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ===================== INÍCIO-GESTÃO · RESUMO EXECUTIVO (Coordenação/Admin) =====================
   Construído 100% no cliente a partir de state.data (ação 'state', já filtrada por tenant no
   servidor): carteira de projetos (proj), horas/pendências (lanc) e responsáveis (projx). Nenhuma
   ação /api nova, nenhum valor monetário, cor só por token. O roteamento por papel é do servidor
   (state.coord/state.papel vêm de auth()); a UI só escolhe o que desenhar. Para Admin, o resumo
   de Engenharia é embrulhado nas ABAS POR ÁREA (Engenharia · Comercial · Financeiro). */
function _execDist(list,key){
  var c={}; list.forEach(function(p){var k=String(p[key]||"").trim()||"—";c[k]=(c[k]||0)+1;});
  var arr=Object.keys(c).map(function(k){return {k:k,n:c[k]};}).sort(function(a,b){return b.n-a.n;});
  var top=arr.slice(0,6), max=top.length?top[0].n:1;
  var ser=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  if(!top.length) return '<p class="muted" style="margin:0">Sem dados para distribuir.</p>';
  return top.map(function(x,i){
    var pct=Math.round(x.n/max*100);
    return '<div class="exec-dist" data-go="projetos" title="Abrir a carteira de projetos" style="margin:7px 0;cursor:pointer">'+
      '<div style="display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-bottom:3px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.k)+'</span><span class="muted" style="font-variant-numeric:tabular-nums">'+x.n+'</span></div>'+
      '<div style="height:8px;background:var(--chart-track);border-radius:999px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+ser[i%6]+';border-radius:999px"></div></div>'+
    '</div>';
  }).join("");
}
/* DESTAQUES DA SEMANA — derivados no SERVIDOR (state.data.destaques), agrupados por lente.
   A UI só apresenta; nada de cálculo de prioridade aqui. Clicar abre o detalhe do projeto. */
function _execDestaques(){
  var ds=(state.data&&state.data.destaques)||[];
  if(!ds.length)return "";
  var grupos=[
    {tipo:"prazo",titulo:"Prazo nesta semana",icon:"📅"},
    {tipo:"gut",titulo:"Maior prioridade (GUT)",icon:"🔺"},
    {tipo:"consumo",titulo:"Consumo / estouro de horas",icon:"⏱️"},
    {tipo:"ativo",titulo:"Mais horas na semana",icon:"🔥"}
  ];
  var cols=grupos.map(function(g){
    var itens=ds.filter(function(d){return d.tipo===g.tipo;});
    if(!itens.length)return "";
    var linhas=itens.map(function(d){
      var val="";
      if(d.tipo==="prazo")val='<span class="muted" style="font-size:.74rem">'+esc(d.valor)+'</span>';
      else if(d.tipo==="gut")val=_gutChip(d.valor);
      else if(d.tipo==="consumo")val='<span class="tag '+(d.estouro?"tag-crit":"tag-warn")+'" style="font-size:.68rem">'+d.valor+'%</span>';
      else if(d.tipo==="ativo")val='<span class="muted" style="font-size:.74rem;font-variant-numeric:tabular-nums">'+fmtH(d.valor)+'</span>';
      return '<div class="pj-dest" data-cc="'+esc(d.cc)+'" style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;cursor:pointer;border-top:1px solid var(--line)">'+
        '<div style="min-width:0"><div style="font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.projeto)+'</div>'+
        '<div class="muted" style="font-size:.7rem">'+esc(d.cc)+(d.cliente?" · "+esc(d.cliente):"")+'</div></div>'+
        '<div style="flex:0 0 auto">'+val+'</div></div>';
    }).join("");
    return '<div class="card" style="padding:10px 12px"><h3 style="margin:0 0 4px;font-size:.84rem">'+g.icon+' '+esc(g.titulo)+'</h3>'+linhas+'</div>';
  }).join("");
  if(!cols)return "";
  return '<h3 style="margin:18px 0 8px;font-size:.95rem">Destaques da semana</h3>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">'+cols+'</div>';
}
/* HORAS GASTO × PREVISTO (nível executivo, como o .pbix): comparação por projeto (top consumo)
   e total da carteira, por tokens --chart-*; estouro em crítico, demais em acento. Sem R$. */
function _execHorasComp(){
  var proj=_pjProj().filter(function(p){return p._prev>0;});
  if(!proj.length)return "";
  var totP=0,totG=0; proj.forEach(function(p){totP+=p._prev;totG+=p._gastas;});
  var lista=proj.map(function(p){return {p:p,pct:p._prev>0?p._gastas/p._prev*100:0};})
    .sort(function(a,b){return b.pct-a.pct;}).slice(0,12);
  var nEst=proj.filter(function(p){return p._gastas>p._prev;}).length;
  var linha=function(nome,cc,g,pv){
    var pct=pv>0?g/pv*100:0,estouro=g>pv,w=Math.min(100,pct);
    var cor=estouro?"var(--crit)":(pct>=85?"var(--warn)":"var(--chart-accent)");
    return '<div class="pj-dest" '+(cc?'data-cc="'+esc(cc)+'" style="cursor:pointer;':'style="')+'margin:7px 0">'+
      '<div style="display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-bottom:3px">'+
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nome)+'</span>'+
        '<span class="muted" style="font-variant-numeric:tabular-nums;white-space:nowrap">'+fmtH(g)+' / '+fmtH(pv)+' · '+Math.round(pct)+'%</span></div>'+
      '<div style="height:9px;background:var(--chart-track);border-radius:999px;overflow:hidden"><div style="height:100%;width:'+w+'%;background:'+cor+';border-radius:999px"></div></div>'+
    '</div>';
  };
  var barras=lista.map(function(x){return linha(x.p.projeto,x.p.cc,x.p._gastas,x.p._prev);}).join("");
  return '<div class="card" style="margin-top:16px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">'+
      '<h3 style="margin:0;font-size:.9rem">Horas — gasto × previsto (contrato)</h3>'+
      (nEst>0?'<span class="tag tag-crit" style="font-size:.68rem">'+nEst+' em estouro</span>':'<span class="tag tag-ok" style="font-size:.68rem">nenhum estouro</span>')+
    '</div>'+
    '<div style="border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px">'+linha("TOTAL DA CARTEIRA ("+proj.length+" projetos com contrato)","",totG,totP)+'</div>'+
    barras+
    '<p class="muted" style="font-size:.72rem;margin:8px 0 0">Projetos com horas de contrato cadastradas, ordenados por consumo. Clique para o detalhe.</p>'+
  '</div>';
}
function _execResumo(){
  var proj=_pjProj();
  var hj=hoje(), mes=hj.slice(0,7), hjD=_d(hj);
  var lanc=state.data.lanc||[];
  var nAnd=0,nIni=0,nEsp=0,nConc=0;
  proj.forEach(function(p){var s=_norm(p.status);
    if(s.indexOf("ANDAMENTO")>=0)nAnd++;
    else if(s.indexOf("ESPERA")>=0)nEsp++;
    else if(s.indexOf("INICIAR")>=0)nIni++;
    else if(s.indexOf("CONCLU")>=0)nConc++;
  });
  var pend=lanc.filter(function(r){return r.s==="PENDENTE";}).length;
  var hMes=lanc.filter(function(r){return String(r.d).slice(0,7)===mes;}).reduce(function(s,r){return s+Number(r.h);},0);
  /* Última movimentação (apontamento) por centro de custo, para marcar projeto parado. */
  var mov={}; lanc.forEach(function(r){var d=String(r.d);if(!mov[r.cc]||d>mov[r.cc])mov[r.cc]=d;});
  var limiteMov=somaDias(hj,-30);
  var andamento=proj.filter(function(p){return _norm(p.status).indexOf("ANDAMENTO")>=0;});
  function risco(p){
    var prazo=p.previsto||p.fim||"", pd=_d(prazo);
    if(!pd) return {k:"semdata",ord:2,lbl:"Sem prazo",cor:"var(--warn)",prazo:""};
    var diff=Math.round((pd-hjD)/86400000);
    if(diff<0)  return {k:"venc", ord:0,lbl:"Vencido", cor:"var(--crit)",prazo:prazo};
    if(diff<=14)return {k:"risco",ord:1,lbl:"Em risco",cor:"var(--warn)",prazo:prazo};
    return {k:"ok",ord:3,lbl:"No prazo",cor:"var(--ok)",prazo:prazo};
  }
  var rows=andamento.map(function(p){
    return {p:p, r:risco(p), semMov:(!mov[p.cc]||mov[p.cc]<limiteMov)};
  }).sort(function(a,b){return a.r.ord-b.r.ord || String(a.r.prazo||"zzzz").localeCompare(String(b.r.prazo||"zzzz"));});
  var nVenc=rows.filter(function(x){return x.r.k==="venc";}).length;
  var nRisco=rows.filter(function(x){return x.r.k==="risco";}).length;
  var nSemMov=rows.filter(function(x){return x.semMov;}).length;
  var trs=rows.map(function(x){
    var p=x.p;
    var chip='<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:600;color:var(--chip-ink);background:'+x.r.cor+'">'+esc(x.r.lbl)+'</span>';
    var movTag=x.semMov?' <span class="tag tag-warn" style="font-size:.64rem;margin-left:4px">parado 30d+</span>':'';
    return '<tr class="exec-proj" data-cc="'+esc(p.cc)+'" style="cursor:pointer">'+
      '<td style="white-space:nowrap">'+esc(p.cc)+'</td>'+
      '<td>'+esc(p.projeto)+(p.cliente?'<div class="muted" style="font-size:.76rem">'+esc(p.cliente)+'</div>':'')+'</td>'+
      '<td>'+esc(p._resp||"—")+'</td>'+
      '<td class="muted" style="font-size:.8rem;white-space:nowrap">'+esc(x.r.prazo||"—")+'</td>'+
      '<td style="white-space:nowrap">'+chip+movTag+'</td>'+
    '</tr>';
  }).join("")||'<tr><td colspan="5" class="muted center" style="padding:22px">Nenhum projeto em andamento na carteira.</td></tr>';
  /* tile: st => abre a carteira no status (kpi-st/data-st); senão go => navega a um módulo
     (data-go, religado por liga()); senão tile simples. Torna os indicadores clicáveis. */
  var tile=function(v,l,cor,st,go){
    var cls='kpi'+(st?' kpi-st':'');
    var extra=st?(' data-st="'+esc(st)+'" title="Abrir na carteira" style="cursor:pointer"'):(go?(' data-go="'+esc(go)+'" title="Abrir" style="cursor:pointer"'):'');
    return '<div class="'+cls+'"'+extra+'><div class="v"'+(cor?' style="color:'+cor+'"':'')+'>'+v+'</div><div class="l">'+l+'</div></div>';
  };
  return ''+
    viewHead("Gestão da Engenharia","Resumo Executivo","Panorama da carteira para decisão — projetos em andamento, prazos em risco e indicadores da operação. Sem valores monetários.")+
    '<div class="kpis">'+
      tile(nAnd,"Em andamento","var(--brand)","EM ANDAMENTO")+
      tile(nIni+nEsp,"A iniciar / em espera","","*")+
      tile(nConc,"Concluídos","var(--ok)","CONCLUÍDO")+
      tile(pend,"Aprovações pendentes",pend>0?"var(--warn)":"","","pend")+
      tile(fmtH(hMes),"Horas da equipe no mês","")+
    '</div>'+
    '<div class="kpis" style="margin-top:12px">'+
      tile(nVenc,"Prazos vencidos",nVenc>0?"var(--crit)":"var(--ok)","","projetos")+
      tile(nRisco,"Em risco (≤ 14 dias)",nRisco>0?"var(--warn)":"var(--ok)","","projetos")+
      tile(nSemMov,"Em andamento sem movimentação (30d+)",nSemMov>0?"var(--warn)":"","","projetos")+
    '</div>'+
    _execDestaques()+
    _execHorasComp()+
    '<div class="grid2" style="margin-top:16px">'+
      '<div class="card" style="overflow-x:auto">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">'+
          '<h3 style="margin:0;font-size:.9rem">Projetos em andamento — prazos</h3>'+
          '<button class="btn sec sm" data-go="projetos">Ver carteira completa →</button>'+
        '</div>'+
        '<table><thead><tr><th>C. custo</th><th>Projeto / cliente</th><th>Responsável</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>'+trs+'</tbody></table>'+
      '</div>'+
      '<div class="card">'+
        '<h3 style="margin:0 0 8px;font-size:.9rem">Em andamento por cliente</h3>'+
        _execDist(andamento,"cliente")+
        '<h3 style="margin:16px 0 8px;font-size:.9rem">Em andamento por tipo</h3>'+
        _execDist(andamento,"tipo")+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">'+
          '<button class="btn sm" data-go="projetos">📁 Carteira</button>'+
          '<button class="btn sec sm" data-go="pend">⏳ Aprovações</button>'+
          '<button class="btn sec sm" data-go="agenda">📅 Agenda</button>'+
        '</div>'+
      '</div>'+
    '</div>';
}
/* Painel de área (Comercial/Financeiro) no Início Executivo: resumo + principais pontos +

async function enviarLanc(){

/* ---- Apontamentos ---- */
function viewApont(){
  /* Seletor de colaborador (coord/dono): além dos "seus apontamentos", a gestão escolhe QUEM ver.
     Para outro colaborador o backend (lancColab) entrega o histórico COMPLETO; a visão é só leitura
     (não se edita hora de ninguém por aqui). O gate real é o servidor; aqui é só a UI. */
  const podeVerOutros=!!(state.coord||state.owner);
  const alvo=(podeVerOutros&&window.__apColab)?window.__apColab:state.slug;
  const readonly=alvo!==state.slug;
  const meu=readonly
    ? ((window.__apColabData&&window.__apColabData.slug===alvo)?window.__apColabData.lanc.slice():[])
    : meusLanc().filter(r=>r.slug===state.slug);
  let colabSel="";
  if(podeVerOutros){
    const slugs=Array.from(new Set((state.data.lanc||[]).map(r=>r.slug).concat([state.slug]))).filter(Boolean);
    slugs.sort((a,b)=>String(nomeDe(a)).localeCompare(String(nomeDe(b)),"pt"));
    colabSel='<div class="field" style="margin:0;min-width:190px"><label style="font-size:.75rem">Colaborador</label><select id="ap-colab">'+slugs.map(s=>'<option value="'+esc(s)+'"'+(s===alvo?' selected':'')+'>'+esc(nomeDe(s))+(s===state.slug?' (você)':'')+'</option>').join('')+'</select></div>';
  }
  // Estado do navegador de período (persiste entre renders)
  if(!window.__apModo)window.__apModo="semana";
  if(!window.__apCursor)window.__apCursor=hoje();
  const modo=window.__apModo, cur=window.__apCursor;
  const deF=(window.__apDe||""), ateF=(window.__apAte||"");
  const temRange=!!(deF&&ateF);
  // Limites do período selecionado
  let pIni,pFim,pLabel;
  if(modo==="ano"){pIni=cur.slice(0,4)+"-01-01";pFim=cur.slice(0,4)+"-12-31";pLabel="Ano "+cur.slice(0,4);}
  else if(modo==="mes"){const ym=cur.slice(0,7);pIni=ym+"-01";pFim=somaDias(addMeses(ym+"-01",1),-1);pLabel=nomeMesLongo(cur.slice(5,7))+" de "+cur.slice(0,4);}
  else{const seg=segundaDe(cur);pIni=seg;pFim=somaDias(seg,6);pLabel="Semana de "+brData(seg)+" a "+brData(pFim)+"/"+pFim.slice(0,4);}
  // Filtro efetivo para a tabela: range manual tem prioridade sobre o período
  const fIni=temRange?deF:pIni, fFim=temRange?ateF:pFim;
  const noPeriodo=r=>String(r.d)>=fIni&&String(r.d)<=fFim;
  const meuP=meu.filter(noPeriodo);
  const aprovP=meuP.filter(r=>r.s==="APROVADO"||r.s==="LANÇADO");
  // Resumo visual conforme o modo (sempre o aprovado do PERÍODO, ignorando range manual)
  const aprovPer=meu.filter(r=>String(r.d)>=pIni&&String(r.d)<=pFim&&(r.s==="APROVADO"||r.s==="LANÇADO"));
  let resumo="";
  if(modo==="ano"){
    const yy=cur.slice(0,4);
    resumo=[...Array(12)].map((_,i)=>{
      const mm=String(i+1).padStart(2,"0");
      const tot=aprovPer.filter(r=>String(r.d).slice(5,7)===mm).reduce((s,r)=>s+Number(r.h),0);
      return `<div class="day"><div class="dh">${nomeMes(i+1)}</div><div class="dt">${tot?fmtH(tot):"—"}</div></div>`;
    }).join("");
  }else if(modo==="mes"){
    // Semanas (seg) que tocam o mês
    const cells=[];let w=segundaDe(pIni);
    while(w<=pFim){
      const wf=somaDias(w,6);
      const tot=aprovPer.filter(r=>String(r.d)>=w&&String(r.d)<=wf).reduce((s,r)=>s+Number(r.h),0);
      cells.push(`<div class="day"><div class="dh">${brData(w)}–${brData(wf)}</div><div class="dt">${tot?fmtH(tot):"—"}</div></div>`);
      w=somaDias(w,7);
    }
    resumo=cells.join("");
  }else{
    const seg=segundaDe(cur);const dias=[...Array(7)].map((_,i)=>somaDias(seg,i));
    const dn=["seg","ter","qua","qui","sex","sáb","dom"];
    resumo=dias.map((d,i)=>{
      const tot=aprovPer.filter(r=>r.d===d).reduce((s,r)=>s+Number(r.h),0);
      return `<div class="day"><div class="dh">${dn[i]} ${brData(d)}</div><div class="dt">${tot?fmtH(tot):"—"}</div></div>`;
    }).join("");
  }
  const linhas=meuP.slice().sort((a,b)=>String(b.d).localeCompare(String(a.d))).map(r=>{
    const editavel=(r.s==="PENDENTE"||r.s==="DEVOLVIDO");
    return `<tr>
      <td>${brData(r.d)}/${String(r.d).slice(0,4)}</td>
      <td>${esc(r.cc)}${nomeProj(r.cc)?`<div class="muted" style="font-size:.8rem">${esc(nomeProj(r.cc))}</div>`:""}</td>
      <td>${fmtH(r.h)}</td>
      <td>${esc(r.t)}${r.s==="DEVOLVIDO"&&r.m?`<div class="err" style="font-size:.8rem">Devolvido: ${esc(r.m)}</div>`:""}</td>
      <td><span class="tag s-${r.s}">${r.s}</span></td>
      <td>${(!readonly&&editavel)?`<button class="linkbtn" data-edit="${r.id}">editar</button> · <button class="linkbtn" data-del="${r.id}">excluir</button>`:""}</td>
    </tr>`;
  }).join("");
  const hAprovP=aprovP.reduce((s,r)=>s+Number(r.h),0);
  const nPendP=meuP.filter(r=>r.s==="PENDENTE").length;
  const nDevP=meuP.filter(r=>r.s==="DEVOLVIDO").length;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v" style="color:var(--ok)">${fmtH(hAprovP)}</div><div class="l">Horas aprovadas (período)</div></div>
    <div class="kpi"><div class="v"${nPendP?' style="color:var(--warn)"':''}>${nPendP}</div><div class="l">Pendentes (período)</div></div>
    <div class="kpi"><div class="v"${nDevP?' style="color:var(--crit)"':''}>${nDevP}</div><div class="l">Devolvidos (período)</div></div>
    <div class="kpi"><div class="v">${meuP.length}</div><div class="l">Lançamentos no período</div></div>
  </div>`;
  const btn=(m,lbl)=>`<button class="btn sm ${modo===m?'':'sec'}" data-apmodo="${m}" type="button">${lbl}</button>`;
  const nav=`<div class="card" style="padding:12px 14px;margin:6px 0 16px">
    <div class="row" style="align-items:center;flex-wrap:wrap;gap:8px">
      ${colabSel}
      <div class="row" style="gap:6px;margin:0">${btn("semana","Semana")}${btn("mes","Mês")}${btn("ano","Ano")}</div>
      <div class="row" style="gap:6px;margin:0;align-items:center">
        <button class="btn sm sec" id="ap-prev" type="button" title="Anterior">◀</button>
        <b style="min-width:200px;text-align:center">${pLabel}</b>
        <button class="btn sm sec" id="ap-next" type="button" title="Próximo">▶</button>
        <button class="btn sm sec" id="ap-hoje" type="button">Hoje</button>
      </div>
      <div class="row" style="gap:6px;margin:0;align-items:flex-end;margin-left:auto">
        <div class="field" style="margin:0"><label style="font-size:.75rem">De</label><input type="date" id="ap-de" value="${deF}"></div>
        <div class="field" style="margin:0"><label style="font-size:.75rem">Até</label><input type="date" id="ap-ate" value="${ateF}"></div>
        <button class="btn sm" id="ap-filtrar" type="button">Filtrar datas</button>
        ${temRange?'<button class="btn sm sec" id="ap-limpar" type="button">Limpar</button>':''}
      </div>
    </div>
    ${temRange?`<div class="muted" style="margin-top:8px;font-size:.82rem">📅 Filtro de datas ativo (${brData(deF)}/${deF.slice(0,4)} a ${brData(ateF)}/${ateF.slice(0,4)}) — a navegação de período fica suspensa até limpar.</div>`:''}
  </div>`;
  return viewHead("Minhas Horas",readonly?("Apontamentos de "+esc(nomeDe(alvo))):"Seus apontamentos",readonly?("Visão somente-leitura dos apontamentos de "+esc(nomeDe(alvo))+" (histórico completo). Navegue por período ou filtre um intervalo de datas."):"Suas horas lançadas, com situação de cada apontamento. Navegue por semana, mês ou ano, ou filtre um intervalo de datas.")+
  nav+kpis+
  `<h3 style="font-size:1rem;margin-top:6px">${temRange?'Resumo do período selecionado no navegador':'Resumo — '+pLabel+' (só o aprovado)'}</h3>
  <div class="week" style="margin-bottom:20px">${resumo}</div>
  <div class="card table-card">
    <table><thead><tr><th>Data</th><th>Centro de custo</th><th>Horas</th><th>Atividade</th><th>Situação</th><th></th></tr></thead>
    <tbody>${linhas||'<tr><td colspan="6" class="muted center" style="padding:22px">Nenhum lançamento neste período.</td></tr>'}</tbody></table>
  </div>`;
}

/* Pedidos de primeiro acesso aguardando liberacao. Sem liberar aqui, ninguem entra:
   criar senha sozinho deixou de conceder acesso. */
async function carregarPinPend(){
  const box=document.getElementById("pend-acesso");
  if(!box)return;
  try{
    const j=await api("pinpend",{});
    const its=j.itens||[];
    if(!its.length){
      box.innerHTML='<b>Primeiro acesso</b><div class="muted" style="margin-top:6px">Nenhum pedido aguardando liberação.</div>';
      return;
    }
    box.innerHTML='<b>Primeiro acesso — '+its.length+' aguardando liberação</b>'
      +'<p class="muted" style="margin:6px 0 10px">Libere apenas se você reconhece a pessoa e esperava esse cadastro. Confira o IP e o horário: um pedido que você não esperava pode ser tentativa de tomar a conta.</p>'
      +'<table><thead><tr><th>Pessoa</th><th>Quando</th><th>IP de origem</th><th></th></tr></thead><tbody>'
      +its.map(function(it){
        return '<tr><td>'+esc(it.nome)+(it.coord?' <span class="muted">(Coordenação)</span>':'')+'</td>'
          +'<td>'+esc(String(it.quando||""))+'</td>'
          +'<td>'+esc(String(it.ip||""))+'</td>'
          +'<td class="row"><button class="btn sm" data-pinlib="'+esc(it.slug)+'">Liberar</button>'
          +'<button class="btn sm danger" data-pinneg="'+esc(it.slug)+'">Negar</button></td></tr>';
      }).join("")+'</tbody></table>';
    box.querySelectorAll("[data-pinlib]").forEach(function(b){
      b.onclick=async function(){
        if(!confirm("Liberar o primeiro acesso de "+b.dataset.pinlib+"? A pessoa passará a entrar com a senha que ela cadastrou."))return;
        try{await api("pinlib",{alvo:b.dataset.pinlib});toast("Acesso liberado.");carregarPinPend()}catch(e){alert(e.message)}
      };
    });
    box.querySelectorAll("[data-pinneg]").forEach(function(b){
      b.onclick=async function(){
        if(!confirm("Negar e descartar o pedido de "+b.dataset.pinneg+"?"))return;
        try{await api("pinneg",{alvo:b.dataset.pinneg});toast("Pedido descartado.");carregarPinPend()}catch(e){alert(e.message)}
      };
    });
  }catch(e){
    box.innerHTML='<b>Primeiro acesso</b><div class="muted" style="margin-top:6px">Não foi possível carregar os pedidos: '+esc(e.message)+'</div>';
  }
}

/* T7 — Solicitações de acesso ao portal. Quem pede nasce Cliente; aqui a Coordenação concede
   o papel (Admin para papéis sensíveis — o servidor nega o resto) ou rejeita. */
function _rotuloPapel(p){return ({admin:"Admin",coordenacao:"Coordenação",equipe:"Equipe",cliente:"Cliente",fornecedor:"Fornecedor"})[p]||p}
async function carregarAcessoPend(){
  const box=document.getElementById("pend-solacesso");
  if(!box)return;
  try{
    const j=await api("acessoListar",{});
    const its=(j.acesso||[]).filter(function(x){return String(x.status)==="ABERTA"});
    const papeis=j.papeis||["cliente","equipe","coordenacao","admin","fornecedor"];
    if(!its.length){
      box.innerHTML='<b>Solicitações de acesso</b><div class="muted" style="margin-top:6px">Nenhum pedido aguardando decisão.</div>';
      return;
    }
    box.innerHTML='<b>Solicitações de acesso — '+its.length+' aguardando decisão</b>'
      +'<p class="muted" style="margin:6px 0 10px">Confira a pessoa antes de aprovar. Aprovar concede o papel escolhido; conceder Coordenação ou Admin é restrito ao Admin. Rejeitar encerra o pedido — a pessoa continua como Cliente.</p>'
      +'<table><thead><tr><th>Pessoa</th><th>E-mail</th><th>Quando</th><th>Papel</th><th></th></tr></thead><tbody>'
      +its.map(function(it){
        var sel='<select data-acpapel="'+esc(it.id)+'">'+papeis.map(function(p){
          return '<option value="'+esc(p)+'"'+(p===it.papel_sol?' selected':'')+'>'+esc(_rotuloPapel(p))+'</option>';
        }).join("")+'</select>';
        return '<tr><td>'+esc(it.nome||"")+'</td>'
          +'<td>'+esc(it.email||"")+'</td>'
          +'<td>'+esc(String(it.criado||"").slice(0,10))+'</td>'
          +'<td>'+sel+'</td>'
          +'<td class="row"><button class="btn sm" data-acaprov="'+esc(it.id)+'">Aprovar</button>'
          +'<button class="btn sm danger" data-acrej="'+esc(it.id)+'">Rejeitar</button></td></tr>';
      }).join("")+'</tbody></table>';
    box.querySelectorAll("[data-acaprov]").forEach(function(b){
      b.onclick=async function(){
        var id=b.dataset.acaprov;
        var sel=box.querySelector('[data-acpapel="'+id+'"]');
        var papel=sel?sel.value:"cliente";
        if(!confirm("Aprovar este acesso como "+_rotuloPapel(papel)+"?"))return;
        try{await api("acessoAprovar",{id,papel});toast("Acesso aprovado.");carregarAcessoPend()}catch(e){alert(e.message)}
      };
    });
    box.querySelectorAll("[data-acrej]").forEach(function(b){
      b.onclick=async function(){
        if(!confirm("Rejeitar e encerrar este pedido?"))return;
        try{await api("acessoRejeitar",{id:b.dataset.acrej});toast("Pedido rejeitado.");carregarAcessoPend()}catch(e){alert(e.message)}
      };
    });
  }catch(e){
    box.innerHTML='<b>Solicitações de acesso</b><div class="muted" style="margin-top:6px">Não foi possível carregar os pedidos: '+esc(e.message)+'</div>';
  }
}

/* T8 — Trilha de auditoria (só Coordenação; a ação é negada no servidor). Somente-leitura:
   não há botão que edite ou apague registro. Filtros por período/autor/alvo/tipo, aplicados
   no servidor; o resultado já vem limitado ao tenant de quem consulta. */
function _labelEv(ev){return ({
  papel_concedido:"Papel concedido",acesso_solicitado:"Acesso solicitado",
  acesso_aprovado:"Acesso aprovado",acesso_rejeitado:"Acesso rejeitado",
  allow_set:"Allowlist definida",allow_remove:"Allowlist removida",
  senha_solicitada:"Senha solicitada",senha_liberada:"Senha liberada",
  senha_negada:"Senha negada",senha_reset:"Senha redefinida",
  email_alterado:"E-mail de login alterado",permset:"Permissão de área",
  acset:"Acesso ao acervo",mcptoken:"Token MCP emitido",mcprevoke:"Token MCP revogado",
  membro_add:"Colaborador adicionado",membro_set:"Colaborador alterado",membro_del:"Colaborador removido",
  membro_cliente_set:"Cliente associado",liberar_cliente:"Projeto liberado ao cliente",
  brief_add:"Fonte do Brief adicionada",brief_del:"Fonte do Brief removida"
})[ev]||ev}
async function carregarTrilha(){
  var lista=document.getElementById("tr-lista");
  if(!lista)return;
  var sel=document.getElementById("tr-tipo");
  var p={soSens:document.getElementById("tr-sens").checked?"1":""};
  var de=document.getElementById("tr-de").value; if(de)p.de=de;
  var ate=document.getElementById("tr-ate").value; if(ate)p.ate=ate;
  var autor=document.getElementById("tr-autor").value.trim(); if(autor)p.autor=autor;
  var alvo=document.getElementById("tr-alvo").value.trim(); if(alvo)p.alvo=alvo;
  var tipo=sel?sel.value:""; if(tipo)p.tipo=tipo;
  lista.innerHTML='<div class="muted" style="padding:10px">Carregando trilha…</div>';
  try{
    var j=await api("auditoria",p);
    if(sel&&sel.options.length<=1&&j.tipos){
      j.tipos.forEach(function(t){var o=document.createElement("option");o.value=t;o.textContent=_labelEv(t);sel.appendChild(o)});
    }
    var evs=j.eventos||[];
    if(!evs.length){lista.innerHTML='<div class="muted" style="padding:14px">Nenhum registro para esse filtro.</div>';return}
    lista.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>Quando</th><th>Ação</th><th>Autor</th><th>Alvo / detalhe</th><th>IP</th></tr></thead><tbody>'
      +evs.map(function(e){
        var quando=String(e.ts||"").replace("T"," ").slice(0,16);
        return '<tr><td>'+esc(quando)+'</td><td>'+esc(_labelEv(e.ev))+'</td><td>'+esc(nomeDe(e.slug))+'</td><td>'+esc(String(e.det||""))+'</td><td class="muted">'+esc(String(e.ip||""))+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }catch(e){
    lista.innerHTML='<div class="muted" style="padding:14px">Não foi possível carregar a trilha: '+esc(e.message)+'</div>';
  }
}

  document.querySelectorAll(".exec-proj[data-cc]").forEach(b=>b.onclick=()=>openProjDetail(b.dataset.cc));
  document.querySelectorAll(".kpi-st[data-st]").forEach(b=>b.onclick=()=>irProjetosStatus(b.dataset.st));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delLanc(b.dataset.del));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editLanc(b.dataset.edit));
  document.querySelectorAll("[data-aprov]").forEach(b=>b.onclick=()=>situacao(b.dataset.aprov,"APROVADO"));
  document.querySelectorAll("[data-devol]").forEach(b=>b.onclick=()=>devolver(b.dataset.devol));
  if(state.view==="apont"){
    document.querySelectorAll("[data-apmodo]").forEach(b=>b.onclick=()=>{window.__apModo=b.dataset.apmodo;render()});
    var apP=document.getElementById("ap-prev"); if(apP)apP.onclick=function(){var m=window.__apModo,c=window.__apCursor||hoje();window.__apCursor=m==="ano"?addAnos(c,-1):m==="mes"?addMeses(c,-1):somaDias(c,-7);render()};
    var apN=document.getElementById("ap-next"); if(apN)apN.onclick=function(){var m=window.__apModo,c=window.__apCursor||hoje();window.__apCursor=m==="ano"?addAnos(c,1):m==="mes"?addMeses(c,1):somaDias(c,7);render()};
    var apH=document.getElementById("ap-hoje"); if(apH)apH.onclick=function(){window.__apCursor=hoje();render()};
    var apF=document.getElementById("ap-filtrar"); if(apF)apF.onclick=function(){var de=document.getElementById("ap-de").value,ate=document.getElementById("ap-ate").value;if(!de||!ate){alert("Informe as duas datas (De e Até).");return}if(de>ate){alert("A data inicial não pode ser maior que a final.");return}window.__apDe=de;window.__apAte=ate;render()};
    var apL=document.getElementById("ap-limpar"); if(apL)apL.onclick=function(){window.__apDe="";window.__apAte="";render()};
    var apC=document.getElementById("ap-colab"); if(apC)apC.onchange=function(){
      var s=apC.value;
      if(s===state.slug){window.__apColab="";window.__apColabData=null;render();return;}
      if(window.__apColabData&&window.__apColabData.slug===s){window.__apColab=s;render();return;}
      window.__apColab=s;
      api("lancColab",{slug:s}).then(function(j){window.__apColabData={slug:s,lanc:j.lanc||[]};render();}).catch(function(e){window.__apColab="";window.__apColabData=null;alert(e.message||"Erro ao carregar apontamentos.");render();});
    };
  }
  if(state.view==="pend"&&document.getElementById("pend-acesso"))carregarPinPend();
  if(state.view==="pend"&&document.getElementById("pend-solacesso"))carregarAcessoPend();
  if(state.view==="pend"&&document.getElementById("pend-trilha")){
    carregarTrilha();
    var trb=document.getElementById("tr-buscar"); if(trb)trb.onclick=carregarTrilha;
    var trl=document.getElementById("tr-limpar"); if(trl)trl.onclick=function(){
      ["tr-de","tr-ate","tr-autor","tr-alvo"].forEach(function(id){var el=document.getElementById(id);if(el)el.value=""});
      var s=document.getElementById("tr-tipo");if(s)s.value="";
      var c=document.getElementById("tr-sens");if(c)c.checked=true;
      carregarTrilha();
    };
  }
}
async function delLanc(id){
  if(!confirm("Excluir este lançamento?"))return;
  try{await api("del",{id});await carregarState();toast("Lançamento excluído.");render()}catch(e){alert(e.message)}
}
async function editLanc(id){
  const r=(state.data.lanc||[]).find(x=>x.id===id);if(!r)return;
  const h=prompt("Horas:",String(r.h).replace(".",","));if(h===null)return;
  const t=prompt("O que foi feito:",r.t);if(t===null)return;
  try{
    await api("edit",{id,entry:{d:r.d,cc:r.cc,h:Number(String(h).replace(",",".")),t:t.trim()}});
    await carregarState();toast("Lançamento atualizado.");render();
  }catch(e){alert(e.message)}
}
async function situacao(id,s){
  try{await api("situacao",{id,s});await carregarState();toast("Aprovado.");render()}catch(e){alert(e.message)}
}
async function devolver(id){
  const m=prompt("Motivo da devolução (a pessoa verá):");if(m===null)return;
  if(m.trim().length<3){alert("Descreva o motivo.");return}
  try{await api("situacao",{id,s:"DEVOLVIDO",m:m.trim()});await carregarState();toast("Devolvido.");render()}catch(e){alert(e.message)}
}

$("#ap-sair").onclick=async()=>{try{await api("logout",{})}catch(e){}try{localStorage.removeItem("ce_tok")}catch(_){}location.reload()};
$("#ap-tema").onclick=trocaTema;
aplicaTema();
(async function boot(){
  initLogin();
  if(checarLinkRecuperacao())return;   /* link de recuperação (T5) tem prioridade sobre a sessão */
  /* M2: a sessão vive em cookie HttpOnly (não-legível por JS). entrarApp() ENGOLE erros de auth
     e sempre mostra o app, então NÃO serve para decidir sessão: primeiro SONDA o servidor com uma
     ação autenticada barata ('perfil', piso cliente). Só entra no app se a sonda passar; senão
     mantém a tela de login visível e o app oculto. */
  try{
    await api("perfil");
    await entrarApp();
  }catch(e){
    try{localStorage.removeItem("ce_tok")}catch(_){}
    state.token="";
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
  }
})();
</script>
