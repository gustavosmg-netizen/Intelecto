# Tanque de equalização com chegada por gravidade, extravasor sifonado, descarga de fundo
# e recalque por bomba centrífuga afogada. Coordenadas em mm; piso acabado em z = 0;
# x para leste, y para norte. Origem do tanque = centro do fundo interno.
projeto: TQ-01 equalização (exemplo)
arquivo: tanque_equalizacao
piso: 0

equipamentos:
  - tipo: tanque
    tag: TQ-01
    origem: [0, 0, 0]
    comprimento: 4000        # interno, em x
    largura: 3000            # interno, em y
    altura: 3200             # do fundo à borda
    parede: 250
    laje: 300
    na: 2600                 # N.A. de operação
    na_max: 2800             # N.A. máximo (início do extravasamento)
    bocais:
      - {tag: N1, papel: entrada,    parede: oeste, posicao: 0,     dn: 150, geratriz_inferior: 2900}
      - {tag: N2, papel: extravasor, parede: norte, posicao: 1200,  dn: 150, geratriz_inferior: 2850}
      - {tag: N3, papel: descarga,   parede: sul,   posicao: 1200,  dn: 100, geratriz_inferior: 0}
      - {tag: N4, papel: succao,     parede: leste, posicao: 0,     dn: 150, eixo: 450}

  - tipo: bomba
    tag: B-01
    descricao: "centrífuga 100x80, 25 L/s"
    origem: [3800, 0, 0]     # face do flange de sucção em x=3800, eixo a 450 mm
    rotacao: 0
    dn_succao: 100
    dn_recalque: 80
    altura_eixo: 450

linhas:
  - tag: L-001
    servico: esgoto
    regime: gravidade
    material: pvc_esgoto
    dn: 150
    suportes: true
    origem: {ponto: [-8000, 0, 3034.5], direcao: [1, 0, 0], descricao: "chegada do tratamento preliminar"}
    destino: TQ-01.N1

  - tag: L-002
    servico: esgoto
    regime: gravidade
    material: pvc_esgoto
    dn: 150
    raio_curva: 0.75          # curvas curtas no sifão
    suportes: true
    sifao: {selo_min: 100}
    origem: TQ-01.N2
    pontos:
      - [-1200, 2500, 2922.5]
      - {sifao: {selo: 100}}
      - [-1200, 4400, 2600]
    destino: {ponto: [-1200, 4400, 400], descricao: "caixa de drenagem"}

  - tag: L-003
    servico: esgoto
    regime: gravidade
    material: pvc_pba
    dn: 100
    origem: TQ-01.N3
    componentes:
      - {tipo: gaveta, tag: V-003}
    destino: {ponto: [1200, -3900, 34.5], descricao: "poço de drenagem"}

  - tag: L-004
    servico: esgoto
    regime: pressao
    material: pead
    de: 180
    vazao_ls: 25
    origem: TQ-01.N4
    componentes:
      - {tipo: gaveta, tag: V-004}
      - {tipo: reducao, tag: R-004, de2: 110, excentrica: true, plano: topo, distancia: fim}
    destino: B-01.succao

  - tag: L-005
    servico: esgoto
    regime: pressao
    material: pead
    de: 90
    vazao_ls: 25
    origem: B-01.recalque
    componentes:
      - {tipo: reducao, tag: R-005, de2: 160}     # ampliação logo após a bomba
      - {tipo: retencao, tag: V-005}
      - {tipo: gaveta, tag: V-006}
      - {tipo: junta_desmontagem, tag: JD-005}
      - {tipo: ventosa, tag: VT-005, dn_ramal: 50, distancia: 3400}
    pontos:
      - [4018, 110, 2200]
    destino: {ponto: [9000, 110, 2200], descricao: "para o reator UASB"}

  - tag: L-006
    servico: esgoto
    regime: pressao
    material: pead
    de: 63
    origem: {te: L-005, ponto: [6800, 110, 2200]}
    pontos:
      - [6800, -900, 2200]
    componentes:
      - {tipo: esfera, tag: V-007, distancia: 300}
    destino: {ponto: [6800, -900, 600], descricao: "retorno para lavagem"}
