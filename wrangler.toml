name = "portal-intelecto"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# C1 — desliga a rota publica *.workers.dev: o Worker responde SO pelo dominio dedicado
# (portal.intelecto-eng.com.br). Remove o hostname alternativo nao-gated (defesa de perimetro).
# O dominio custom e configurado no painel Cloudflare e nao e afetado por esta flag.
workers_dev = false

# Migrações versionadas (Onda 0) ficam em ./migrations — que já é o diretório PADRÃO do
# wrangler (`wrangler d1 migrations apply <db>`), então não é preciso declarar migrations_dir.

# Assets estaticos do front-end (index.html, cursos.js, seed.js e imagens).
[assets]
directory = "./public"
binding = "ASSETS"

# Banco D1 (SQLite) - criado em 2026-09-15 na conta Cloudflare da casa.
[[d1_databases]]
binding = "DB"
database_name = "portal-intelecto"
database_id = "75a51d70-63a3-47d6-8986-39f241874d73"

# R2: painéis de Leads Ambientais (aba Comercial) servidos de forma PRIVADA pelo Worker
# (gate por allowlist perm:comercial). Criar o bucket antes do deploy:
#   npx wrangler r2 bucket create portal-intelecto-blob
[[r2_buckets]]
binding = "BLOB"
bucket_name = "portal-intelecto-blob"

# R2: bucket-fonte do Acervo (os 953 docs que o AutoRAG 'acervo-intelecto' indexa).
# Lido de forma PRIVADA pelo Worker (rota /acervo/arquivo + acao acervo_list), gate por
# concessao de acervo (isOwner || acgrant). Permite ABRIR o arquivo, nao so o trecho.
[[r2_buckets]]
binding = "ACERVO"
bucket_name = "acervo-intelecto"

# R2: destino do BACKUP diario do D1 (export JSON datado por cron; retencao 90 dias no codigo).
# Criado em 2026-10-17. Proteção offsite contra incidente de perda de dados (ver LAUDO).
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "portal-intelecto-backup"

[vars]
REPO_URL = ""
MAIL_FROM = ""
MAIL_TO = ""
# RESEND_API_KEY entra como secret:  npx wrangler secret put RESEND_API_KEY

# AI Search (AutoRAG) - acervo-intelecto (adicionado p/ acervo_search)
[ai]
binding = "AI"

# Observabilidade (E-04): liga o Workers Logs — captura os logs estruturados em JSON que o Worker
# emite por requisição (/api) e por cron (ver logEvent em src/index.ts). Sem PII. Consulta no painel
# Cloudflare (Workers & Pages -> portal-intelecto -> Logs) ou via Logpush/Tail.
[observability]
enabled = true
head_sampling_rate = 1

# Crons (gratuitos no plano Workers). Ver handler scheduled() em src/index.ts, que ramifica
# por event.cron:
#  - "*/5 * * * *" : keep-alive (aquece Worker/D1 p/ o handshake /mcp nao estourar timeout).
#  - "0 6 * * *"   : backup diario do D1 -> R2 (03:00 BRT / 06:00 UTC).
#  - "0 9 * * *"   : coletor do Daily Brief (06:00 BRT / 09:00 UTC) — fontes ativas e devidas.
[triggers]
crons = ["*/5 * * * *", "0 6 * * *", "0 9 * * *"]

# ============================================================================
# AMBIENTE DE STAGING (homologação) — Onda 0 do Plano Diretor.
# Worker SEPARADO (portal-intelecto-staging) sobre um D1 SEPARADO (criado em
# 2026-10-20). NÃO toca produção. Deploy: `wrangler deploy --env staging`.
# - workers_dev = true: ganha uma URL *.workers.dev para testar (staging não usa o
#   domínio dedicado). É aceitável aqui porque é ambiente de teste, não produção.
# - crons = []: staging NÃO roda backup nem Daily Brief (não escreve nos buckets de
#   produção por cron). Os bindings R2/AI reusam os buckets de produção só para o
#   Worker compilar; o Acervo é leitura, e BLOB/BACKUP não são exercitados num teste
#   de tela. Para isolamento total, criar buckets próprios de staging depois.
# - O schema já foi aplicado no D1 de staging pelas migrações 0001–0004.
# ============================================================================
[env.staging]
name = "portal-intelecto-staging"
workers_dev = true

[env.staging.assets]
directory = "./public"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "portal-intelecto-staging"
database_id = "7050663a-2875-406f-8ed1-31c802a17fab"

[[env.staging.r2_buckets]]
binding = "BLOB"
bucket_name = "portal-intelecto-blob"

[[env.staging.r2_buckets]]
binding = "ACERVO"
bucket_name = "acervo-intelecto"

[[env.staging.r2_buckets]]
binding = "BACKUP"
bucket_name = "portal-intelecto-backup"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
REPO_URL = ""
MAIL_FROM = ""
MAIL_TO = ""

[env.staging.triggers]
crons = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1
